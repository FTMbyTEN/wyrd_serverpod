# WYRD's recycled answers: every good AI answer to a general question is kept, so the next time
# the same question comes up it answers from memory instead of calling the API. Feedback moves
# `score`: carrying on raises it, a correction lowers it; a retired answer is relearned from the
# AI the next time and replaced -- so each answer gets better over time (LearnedAnswerService).
# authUserId null = shared by everyone; set = learned from one person and only reused for them.
class: LearnedAnswer
table: learned_answer

fields:
  authUserId: UuidValue?
  question: String
  intent: String
  topics: List<String>
  answer: String
  score: double
  uses: int
  version: int
  retired: bool
  createdAt: DateTime
  updatedAt: DateTime
  # meaning fingerprint (Voyage voyage-3.5-lite, 512 dims) for search by meaning; see EmbeddingService
  embedding: Vector(512)?, scope=serverOnly

indexes:
  learned_answer_embedding_idx:
    fields: embedding
    type: hnsw
    distanceFunction: cosine
  learned_answer_intent_idx:
    fields: intent, retired

# Mirrors server.js's user_profiles.json (getProfile/touchProfileVisit), one row per Serverpod
# auth user instead of the old Node-side numeric user id. Node's username lived on its own
# users.json row; here it's folded into this profile since the email IDP's AuthUser has no
# username field of its own.
class: UserProfile
table: user_profile

fields:
  authUserId: UuidValue
  username: String?
  # the sign-in email, copied from the email IDP account on every sign-in so each person is
  # identifiable in WYRD's own tables (not only in the auth tables)
  email: String?
  # their profile picture: a small square image (about 256 px) as a data URL, set by them
  avatar: String?
  facts: List<UserFact>
  visitCount: int
  firstSeen: DateTime
  lastSeen: DateTime

indexes:
  user_profile_auth_user_id_idx:
    fields: authUserId
    unique: true

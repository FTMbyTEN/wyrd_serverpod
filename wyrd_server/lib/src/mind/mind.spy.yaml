# Mirrors the Node backend's persisted mind.json (server.js loadMind/saveMind) as a real
# singleton table row instead of the earlier hardcoded placeholder. WYRD has exactly one mind
# shared by every user, so there is always exactly one row here (id 1).
class: Mind
table: mind

fields:
  mood: String
  focusTopic: String?
  activeGoal: String?
  curiosity: double
  confidence: double
  digest: DigestInfo
  lastEvent: String?
  explorationCount: int
  updatedAt: DateTime

  # (seen/resolved topic sets live in the mind_topic table -- see mind_topic.spy.yaml)
  # Epoch-millisecond timestamps of the last ~20 self-driven answers, used to estimate ratePerMin.
  selfAnswerTimestamps: List<int>

# Mirrors server.js's lexicon.json — one row per word WYRD has attempted to learn via the
# autonomous lexicon tick (lexicon_service.dart), which looks definitions up in the free
# dictionary API. understood is false when the dictionary had no entry for the word.
class: LexiconEntry
table: lexicon_entry

fields:
  word: String
  understood: bool
  definition: String?
  partOfSpeech: String?
  learnedAt: DateTime

indexes:
  lexicon_entry_word_idx:
    fields: word
    unique: true

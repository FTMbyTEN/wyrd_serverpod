# Parametric formula for the gate screen's particle vortex (server.js GET /api/gate-vortex/shape).
# Generated by the LLM from WYRD's current mood, with a deterministic fallback.
# type: lissajous | rose | braid | latticeWave | burstShell | explosionBurst | circuitGrid
class: GateShape

fields:
  type: String
  a: double
  b: double
  freqX: int
  freqY: int
  freqZ: int
  turns: double
  radiusScale: double
  heightScale: double
  twist: double
  label: String

# Mirrors the heterogeneous entries in server.js's memory.json blocks array. Node blocks are
# loosely-typed JSON that vary by source (chat/net/photo/self/synthesis/ingest each set a
# different subset of fields) — this flattens that into one table with the union of fields
# actually written at any push site, leaving the ones a given source doesn't use null.
class: MemoryBlock
table: memory_block

fields:
  legacyId: String?
  timestamp: DateTime
  source: String
  feedSource: String?
  title: String?
  extract: String?
  url: String?
  userText: String?
  botText: String?
  triggeredBy: String?
  topics: List<String>
  curriculumSubject: String?
  curriculumLevel: String?
  question: String?
  answer: String?
  answeredTopic: String?
  insight: String?
  sourceBlockIds: List<int>?
  sourceTopics: List<String>?
  # set by IngestFilter for outside data: a 0..1 quality score and a topic category
  quality: double?
  category: String?
  # meaning fingerprint (Voyage voyage-3.5-lite, 512 dims) for search by meaning; see EmbeddingService
  embedding: Vector(512)?, scope=serverOnly
  # the person a chat or photo memory came from (null for everything WYRD read or thought), so
  # their memories can be exported and deleted with the rest of their data
  ownerId: UuidValue?

indexes:
  memory_block_owner_idx:
    fields: ownerId
  memory_block_embedding_idx:
    fields: embedding
    type: hnsw
    distanceFunction: cosine
  memory_block_timestamp_idx:
    fields: timestamp

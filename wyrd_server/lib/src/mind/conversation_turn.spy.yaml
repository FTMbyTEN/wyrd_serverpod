# Mirrors server.js's conversations.json (userTurns/appendConversationTurn) -- dedicated,
# per-user chat history, deliberately separate from MemoryBlock so real conversation history
# is never at risk of eviction by high-volume autonomous background activity.
class: ConversationTurn
table: conversation_turn

fields:
  authUserId: UuidValue
  userText: String
  botText: String
  timestamp: DateTime
  learnedAnswerId: int? # set when WYRD answered from a learned answer, for feedback
  rating: int? # the person's thumbs: 1 up, -1 down (training signal; see ChatEndpoint.rate)
  judgement: String? # the reply gate's verdict: pass, or softened/corrected/blocked with why (JudgementService)
  groundingIds: List<int>?
  image: String? # a photo they sent with this message: a small JPEG preview (data URL), so it stays in the chat # the shared memories that grounded this reply, so a rating reaches their sources (Bias 2)

indexes:
  conversation_turn_auth_user_id_idx:
    fields: authUserId

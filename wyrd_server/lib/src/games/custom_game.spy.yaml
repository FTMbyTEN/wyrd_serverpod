### A game WYRD programmed for someone at their request (build_game, written in the background):
### one self-contained HTML document, played full screen in a sandboxed frame from their Games tab.
class: CustomGame
table: custom_game

fields:
  authUserId: UuidValue
  title: String
  blurb: String # a line on its tile: what it is and how to play
  html: String # empty while WYRD is still writing it
  status: String? # building, failed, or null when it is ready to play
  # WYRD learning to play it (WYRD LEARNS): its best score, the rounds it has played, and the
  # strategy knobs (JSON) of its best round, which the next session starts from
  wyrdBest: int?
  wyrdRounds: int?
  wyrdParams: String?
  createdAt: DateTime
  updatedAt: DateTime

indexes:
  custom_game_user_idx:
    fields: authUserId, updatedAt

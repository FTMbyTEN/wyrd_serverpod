### A game: against WYRD, or (mode pvp) against another player. The server holds the position and
### checks every move, so a result can be trusted and a rating means something.
class: GameMatch
table: game_match

fields:
  authUserId: UuidValue # who started it (against WYRD: the player; pvp: whoever posted the challenge)
  game: String # chess, connect4, reversi, tictactoe
  state: String # the position (chess: FEN; the others: JSON)
  moves: List<String> # the moves so far
  playerSide: String # against WYRD: the player's side, w (moves first) or b. pvp: the starter's side
  status: String # vs WYRD: active, won, lost, draw, resigned. pvp: waiting, active, over
  wyrdLevel: int # 1 (gentle) to 6 (full strength), chosen from the player's rating
  ratingBefore: double
  ratingAfter: double?
  remark: String? # WYRD's last line (its move, or its commentary on a pvp game)
  mode: String, default='wyrd' # wyrd or pvp
  opponentId: UuidValue? # pvp: who accepted the challenge
  playerName: String? # pvp: names, for the board
  opponentName: String?
  result: String? # pvp, once over: starter, opponent or draw (and how: checkmate, resigned...)
  version: int, default=0 # bumped on every change, so a waiting player can ask "anything new?" cheaply
  viewerSide: String?, !persist # w or b: the side of whoever is looking (filled in per request, never stored)
  createdAt: DateTime
  updatedAt: DateTime

indexes:
  game_match_user_idx:
    fields: authUserId, status
  game_match_open_idx:
    fields: game, mode, status
  game_match_opponent_idx:
    fields: opponentId, status

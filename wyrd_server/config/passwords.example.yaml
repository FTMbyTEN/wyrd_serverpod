# Copy to passwords.yaml (git-ignored) to run the server locally. Fill each value with a long random
# string, except database and redis, which must match the passwords of the "postgres" and "redis"
# services in docker-compose.yaml. anthropicApiKey is optional: without it WYRD runs and answers from what it
# has learned, but without the model.
development:
  database: '<POSTGRES_PASSWORD from docker-compose.yaml>'
  redis: '<the --requirepass value of the "redis" service in docker-compose.yaml>'
  serviceSecret: '<random string>'
  emailSecretHashPepper: '<random string>'
  jwtHmacSha512PrivateKey: '<random string>'
  jwtRefreshTokenHashPepper: '<random string>'
  anthropicApiKey: ''

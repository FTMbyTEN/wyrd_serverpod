<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>LAGOS ISLAND</title>
<meta name="description" content="LAGOS ISLAND: walk Lagos Island, Ikoyi, Victoria Island and Lekki to Ajah, together. Free, in your browser.">
<meta name="theme-color" content="#8ED1F2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1F2A37; --dim: #6B7785; --green: #22B573; --green-dark: #189B60; --white: #FFFFFF;
    --shadow: 0 6px 20px rgba(20, 60, 100, 0.16), 0 1px 3px rgba(20, 60, 100, 0.12);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8ED1F2; color: var(--ink); font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
  canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
  .pill { background: var(--white); border-radius: 999px; box-shadow: var(--shadow); }
  #top { position: fixed; top: max(10px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); width: min(560px, calc(100vw - 20px)); display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px 16px; pointer-events: auto; }
  #title { font-weight: 800; font-size: 17px; letter-spacing: -0.2px; white-space: nowrap; }
  #title span { margin-right: 6px; }
  #online { font-size: 13px; font-weight: 700; color: var(--green); white-space: nowrap; }
  #online i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--green); margin-right: 6px; vertical-align: 1px; }
  #talkTop { margin-left: auto; padding: 9px 16px; border: none; border-radius: 999px; background: var(--green); color: #fff; font: 700 14px 'Plus Jakarta Sans', sans-serif; cursor: pointer; }
  #chips { position: fixed; top: calc(68px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); display: flex; gap: 8px; pointer-events: none; max-width: calc(100vw - 20px); }
  #chips .pill { padding: 6px 12px; font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #where { max-width: 70vw; }
  #log { position: fixed; left: 12px; bottom: calc(150px + env(safe-area-inset-bottom)); max-width: min(360px, 72vw); font-size: 13px; pointer-events: none; display: flex; flex-direction: column; gap: 6px; }
  #log div { background: var(--white); box-shadow: var(--shadow); border-radius: 14px; padding: 6px 11px; }
  #log b { font-weight: 800; }
  .btn { position: fixed; display: grid; place-items: center; border-radius: 50%; font: 800 13px 'Plus Jakarta Sans', sans-serif; color: var(--ink); background: var(--white); box-shadow: var(--shadow); cursor: pointer; user-select: none; border: none; }
  #zoomin { right: 12px; top: calc(118px + env(safe-area-inset-top)); width: 44px; height: 44px; font-size: 22px; }
  #zoomout { right: 12px; top: calc(170px + env(safe-area-inset-top)); width: 44px; height: 44px; font-size: 22px; }
  #okada { right: 16px; bottom: calc(22px + env(safe-area-inset-bottom)); width: 84px; height: 84px; background: var(--green); color: #fff; font-size: 14px; }
  #okada:active { background: var(--green-dark); transform: scale(0.96); }
  #talk { display: none; }
  #stick { position: fixed; left: 20px; bottom: calc(20px + env(safe-area-inset-bottom)); width: 120px; height: 120px; border-radius: 50%; display: none; background: rgba(255, 255, 255, 0.55); box-shadow: var(--shadow); }
  #knob { position: absolute; left: 38px; top: 38px; width: 44px; height: 44px; border-radius: 50%; background: var(--white); box-shadow: var(--shadow); }
  .touch #stick { display: block; }
  body:not(.touch) #okada { width: 70px; height: 70px; font-size: 12px; }
  #say { position: fixed; left: 50%; transform: translateX(-50%); width: min(560px, calc(100vw - 20px)); bottom: calc(120px + env(safe-area-inset-bottom)); display: none; gap: 8px; padding: 6px; }
  #say input { flex: 1; padding: 11px 14px; border: none; border-radius: 999px; background: #F2F6FA; color: var(--ink); font: 500 15px 'Plus Jakarta Sans', sans-serif; outline: none; }
  #say button { padding: 0 20px; border-radius: 999px; border: none; background: var(--green); color: #fff; font: 800 14px 'Plus Jakarta Sans', sans-serif; }
  #card { position: fixed; left: 50%; bottom: calc(140px + env(safe-area-inset-bottom)); transform: translateX(-50%); padding: 12px 18px; border-radius: 20px; display: none; text-align: center; font-size: 13px; color: var(--dim); max-width: 86vw; background: var(--white); box-shadow: var(--shadow); }
  #card b { display: block; font-size: 18px; font-weight: 800; color: var(--ink); margin-bottom: 2px; }
  #hello { position: fixed; inset: 0; display: grid; place-items: end center; padding-bottom: max(20px, env(safe-area-inset-bottom)); background: linear-gradient(180deg, rgba(142, 209, 242, 0) 30%, rgba(90, 174, 224, 0.55)); }
  #hello .box { width: min(400px, calc(100vw - 24px)); padding: 20px; border-radius: 28px; background: rgba(255, 255, 255, 0.94); box-shadow: var(--shadow); text-align: center; }
  #hello h1 { margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.5px; }
  #hello p { margin: 6px 0 14px; color: var(--dim); font-size: 14px; line-height: 1.45; }
  #hello .crowd { font-size: 13px; color: var(--dim); margin-bottom: 12px; }
  #hello .crowd b { color: var(--ink); }
  #hello input { width: 100%; padding: 13px 16px; border-radius: 999px; border: 2px solid #E6EEF5; background: #F7FAFC; color: var(--ink); font: 600 16px 'Plus Jakarta Sans', sans-serif; text-align: center; outline-color: var(--green); }
  #colors { display: flex; justify-content: center; gap: 10px; margin: 12px 0 14px; }
  #colors span { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 3px solid #fff; box-shadow: 0 0 0 2px transparent; }
  #colors span.on { box-shadow: 0 0 0 2px var(--ink); }
  #go { width: 100%; padding: 15px; border-radius: 999px; border: none; background: var(--green); color: #fff; font: 800 17px 'Plus Jakarta Sans', sans-serif; cursor: pointer; box-shadow: 0 4px 0 var(--green-dark); }
  #go:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--green-dark); }
  #credit { position: fixed; left: 50%; transform: translateX(-50%); bottom: 2px; font-size: 9px; color: rgba(31, 42, 55, 0.6); pointer-events: none; }
</style>
</head>
<body>
<canvas id="c" aria-label="The map of Lagos Island"></canvas>
<div id="top" class="pill">
  <div id="title"><span>🌴</span>LAGOS ISLAND</div>
  <div id="online" aria-live="polite"><i></i><span id="count">1</span> online</div>
  <button id="talkTop" aria-label="Say something to people near you">Say</button>
</div>
<div id="chips"><div id="where" class="pill">📍 Tafawa Balewa Square</div></div>
<div id="log" aria-live="polite"></div>
<div id="zoomin" class="btn" role="button" aria-label="Zoom in">+</div>
<div id="zoomout" class="btn" role="button" aria-label="Zoom out">−</div>
<div id="talk" class="btn" role="button" aria-label="Say something">SAY</div>
<div id="okada" class="btn" role="button" aria-label="Hold to ride an okada (faster)">🛵 OKADA</div>
<div id="stick" aria-hidden="true"><div id="knob"></div></div>
<form id="say" class="pill"><input id="sayText" maxlength="140" placeholder="Say something to people near you" autocomplete="off"><button>Send</button></form>
<div id="card"></div>
<div id="hello">
  <div class="box">
    <h1>🌴 LAGOS ISLAND</h1>
    <p>Lagos Island, Ikoyi, VI, Lekki to Ajah, and Ilashe by the sea. Walk it, ride okada, meet the people on it.</p>
    <div class="crowd"><b id="crowd">Lagosians</b> on the island right now · free</div>
    <input id="name" maxlength="24" placeholder="Your name on the island" autocomplete="nickname">
    <div id="colors"></div>
    <button id="go">Enter Lagos Island</button>
  </div>
</div>
<div id="credit">© OpenStreetMap contributors</div>
<script>
(() => {
  // ---------- setup
  const API = new URLSearchParams(location.search).get('api') || location.origin.replace(/^(https?:\/\/)([^.]+)\./, '$1$2.api.');
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  // bright and friendly, day or night: the sky-blue sea, warm sand-cream land, white streets
  // soft grass, flat blue water, grey roads and light grey plots: a sunny little town seen from above
  const C = { sea: '#5DAFE3', seaDeep: '#4FA3DB', land: '#A9D08E', shore: '#E9D9A6', water: '#5DAFE3', road: ['#7D858D', '#848C94', '#939AA1', '#9DA4AA', '#A7ADB3'], casing: '#8FB877', plot: '#E3E6EA', plotEdge: '#D2D6DB', tree: '#3E8E4E', treeLight: '#4FA35E', icon: '#22B573', text: '#1F2A37', halo: '#FFFFFF', label: 'rgba(255,255,255,0.75)' };
  const ROAD_W = [14, 12, 10, 8, 6]; // metres
  const ROAD_MIN = [3, 2.6, 2, 1.4, 1]; // px, so roads read when zoomed out
  const EMOJI = { beach: '🏖️', park: '🌳', faith: '⛪', market: '🛍️', tower: '🏢', hotel: '🏨', culture: '🎭', civic: '🏛️', transport: '🚌', shop: '🛍️', home: '🏡', bridge: '🌉', palace: '👑', square: '⛲', water: '⚓' };
  const EMOJI_ID = { 'central-mosque': '🕌', 'balogun': '🧺', 'idumota': '🧺', 'eko-atlantic': '🏙️', 'link-bridge': '🌉', 'lekki-toll': '🚧', 'ajah': '🧺', 'ilashe': '🏝️', 'tarkwa-bay': '🏄🏾', 'lighthouse-beach': '🗼', 'museum': '🏺', 'nike-gallery': '🎨', 'freedom-park': '🎷', 'ikoyi-club': '⛳', 'banana-island': '🍌', 'muri-okunola': '🌳', 'lekki-conservation': '🌿', 'oba-palace': '👑', 'tbs': '⭐', 'obalende': '🚌', 'eko-hotel': '🏨', 'css-bookshop': '📚' };
  const KIND_DOT = { beach: '#3E9BBE', park: '#58AE7E', faith: '#9AA8F2', market: '#E2A32B', tower: '#7A6656', hotel: '#C4572E', culture: '#B05FA0', civic: '#24316B', transport: '#E5743F', shop: '#E2A32B', home: '#58AE7E', bridge: '#7A6656', palace: '#C9A227', square: '#C4572E', water: '#3E9BBE' };
  const COLORS = ['#22B573', '#FF7A45', '#3B82F6', '#A855F7', '#F59E0B', '#EC4899'];
  const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

  const cv = document.getElementById('c'), x = cv.getContext('2d');
  const isTouch = matchMedia('(pointer: coarse)').matches;
  if (isTouch) document.body.classList.add('touch');
  let W = 0, H = 0, DPR = 1;
  function resize() { DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; }
  addEventListener('resize', resize); resize();

  // ---------- the map
  let map = null, landP = [], waterP = [], roadP = [], icons = [], island = [], landB = [], waterB = [];
  const pathOf = (a) => { const p = new Path2D(); p.moveTo(a[0], a[1]); for (let i = 2; i < a.length; i += 2) p.lineTo(a[i], a[i + 1]); return p; };
  const bboxOf = (a) => { let x0 = Infinity, x1 = -Infinity, z0 = Infinity, z1 = -Infinity; for (let i = 0; i < a.length; i += 2) { x0 = Math.min(x0, a[i]); x1 = Math.max(x1, a[i]); z0 = Math.min(z0, a[i + 1]); z1 = Math.max(z1, a[i + 1]); } return [x0, x1, z0, z1]; };
  function inPoly(a, px, pz) { let c = false; for (let i = 0, j = a.length - 2; i < a.length; j = i, i += 2) { const xi = a[i], zi = a[i + 1], xj = a[j], zj = a[j + 1]; if (zi > pz !== zj > pz && px < ((xj - xi) * (pz - zi)) / (zj - zi) + xi) c = !c; } return c; }
  // the island painted once into a small hidden picture (10 m a pixel): land is one lookup, not a
  // polygon test -- fast enough to place thousands of buildings and to check every step
  const MR = 10; let mask = null, mx0 = 0, mz0 = 0, mw = 0, mh = 0;
  function buildMask() {
    const [x0, x1, z0, z1] = bboxOf(island);
    mx0 = x0; mz0 = z0; mw = Math.ceil((x1 - x0) / MR); mh = Math.ceil((z1 - z0) / MR);
    const off = document.createElement('canvas'); off.width = mw; off.height = mh;
    const o = off.getContext('2d', { willReadFrequently: true });
    o.setTransform(1 / MR, 0, 0, 1 / MR, -x0 / MR, -z0 / MR);
    o.save(); o.clip(islandP);
    o.fillStyle = '#fff'; for (const p of landP) o.fill(p);
    o.fillStyle = '#000'; for (const p of waterP) o.fill(p);
    o.restore();
    const d = o.getImageData(0, 0, mw, mh).data;
    mask = new Uint8Array(mw * mh);
    for (let i = 0; i < mask.length; i++) mask[i] = d[i * 4] > 127 ? 1 : 0;
  }
  const maskAt = (px, pz) => { const i = Math.floor((px - mx0) / MR), j = Math.floor((pz - mz0) / MR); return i >= 0 && j >= 0 && i < mw && j < mh && mask[j * mw + i] === 1; };
  function onLand(px, pz) {
    if (mask) return maskAt(px, pz);
    if (!inPoly(island, px, pz)) return false;
    let land = false;
    for (let i = 0; i < map.land.length; i++) { const b = landB[i]; if (px > b[0] && px < b[1] && pz > b[2] && pz < b[3] && inPoly(map.land[i], px, pz)) { land = true; break; } }
    if (!land) return false;
    for (let i = 0; i < map.water.length; i++) { const b = waterB[i]; if (px > b[0] && px < b[1] && pz > b[2] && pz < b[3] && inPoly(map.water[i], px, pz)) return false; }
    return true;
  }

  // ---------- the town: plots along the streets, a few houses on them, one building for each landmark,
  // and trees -- generated from the streets, the same for everyone (seeded by place). Not many: most
  // plots stay plots, as in a calm little game town.
  const ZONES = {
    island: { gap: 30, d: [14, 24], house: 0.18 },
    vi: { gap: 40, d: [18, 30], house: 0.14 },
    atlantic: { gap: 50, d: [24, 36], house: 0.1 },
    ikoyi: { gap: 46, d: [16, 26], house: 0.14 },
    lekki: { gap: 42, d: [14, 24], house: 0.12 },
    ajah: { gap: 38, d: [12, 20], house: 0.12 },
    beach: { gap: 90, d: [10, 14], house: 0.05 },
  };
  const ROOFS = ['#C2410C', '#B45309', '#9A3412', '#475569', '#0F766E', '#B91C1C'];
  const LANDMARK_ROOF = { faith: '#4F46E5', market: '#D97706', tower: '#64748B', hotel: '#0EA5E9', culture: '#A855F7', civic: '#1E3A8A', transport: '#EA580C', shop: '#F59E0B', home: '#16A34A', palace: '#CA8A04' };
  const OPEN = { square: 110, park: 90, beach: 70, bridge: 40, water: 30 };
  const clearOf = (px, pz) => { for (const ic of icons) { const r = OPEN[ic.kind] ?? 30; if (Math.abs(ic.x - px) < r && Math.abs(ic.z - pz) < r && Math.hypot(ic.x - px, ic.z - pz) < r) return true; } return false; };
  function zoneOf(px, pz) {
    const d = districtOf(px, pz);
    if (d.startsWith('The barrier')) return 'beach';
    if (d === 'Lagos Island') return 'island';
    if (d === 'Eko Atlantic') return 'atlantic';
    if (d === 'Ikoyi') return 'ikoyi';
    if (d === 'Victoria Island') return 'vi';
    if (d === 'Ajah') return 'ajah';
    return 'lekki';
  }
  function rng(seed) { let t = seed >>> 0; return () => { t += 0x6D2B79F5; let r = Math.imul(t ^ (t >>> 15), 1 | t); r ^= r + Math.imul(r ^ (r >>> 7), 61 | r); return ((r ^ (r >>> 14)) >>> 0) / 4294967296; }; }
  const shade = (hex, f) => { const n = parseInt(hex.slice(1), 16); const c = (v) => Math.max(0, Math.min(255, Math.round(v * f))); return '#' + ((c(n >> 16) << 16) | (c((n >> 8) & 255) << 8) | c(n & 255)).toString(16).padStart(6, '0'); };
  const plots = [], houses = [], trees = [], grid = new Map(), BG = 400;
  const put = (kind, o) => { const g = Math.floor(o.x / BG) + ',' + Math.floor(o.z / BG); if (!grid.has(g)) grid.set(g, { plots: [], houses: [], trees: [] }); grid.get(g)[kind].push(o); };
  function genTown() {
    const cell = (px, pz, c) => Math.floor(px / c) + ',' + Math.floor(pz / c);
    const road = new Set(), taken = new Set();
    for (const r of map.roads) {
      const half = ROAD_W[r.k] / 2 + 2;
      for (let i = 2; i < r.p.length; i += 2) {
        const ax = r.p[i - 2], az = r.p[i - 1], bx = r.p[i], bz = r.p[i + 1], L = Math.hypot(bx - ax, bz - az) || 1;
        const ux = (bx - ax) / L, uz = (bz - az) / L;
        for (let t = 0; t <= L; t += 3) for (let o = -half; o <= half; o += 3) road.add(cell(ax + ux * t - uz * o, az + uz * t + ux * o, 6));
      }
    }
    const fits = (cx, cz, ux, uz, nx, nz, w, d) => {
      const cells = [];
      for (let a = -w / 2; a <= w / 2; a += 4) for (let b = -d / 2; b <= d / 2; b += 4) {
        const px = cx + ux * a + nx * b, pz = cz + uz * a + nz * b, c = cell(px, pz, 6);
        if (!maskAt(px, pz) || road.has(c) || taken.has(c)) return null;
        cells.push(c);
      }
      return cells;
    };
    const rect = (cx, cz, ux, uz, nx, nz, w, d) => { const p = []; for (const [a, b] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) p.push(cx + ux * (w / 2) * a + nx * (d / 2) * b, cz + uz * (w / 2) * a + nz * (d / 2) * b); return p; };
    // one chunky building under each landmark's pin (squares, parks and beaches stay open)
    for (const ic of icons) {
      if (OPEN[ic.kind] || !maskAt(ic.x, ic.z)) continue;
      const R = rng(ic.x * 7919 ^ ic.z * 104729), w = 34 + R() * 18, d = 26 + R() * 12;
      const roof = LANDMARK_ROOF[ic.kind] || '#C2410C';
      const o = { p: rect(ic.x, ic.z + 8, 1, 0, 0, 1, w, d), h: ic.kind === 'tower' ? 40 : 16 + R() * 8, roof, wall: '#F8FAFC', side: '#E2E8F0', x: ic.x, z: ic.z };
      houses.push(o); put('houses', o);
      for (const c of fits(ic.x, ic.z + 8, 1, 0, 0, 1, w + 6, d + 6) || []) taken.add(c);
    }
    // plots along the streets; a few of them built on
    for (const r of map.roads) {
      if (r.k === 0) continue;
      for (let i = 2; i < r.p.length; i += 2) {
        const ax = r.p[i - 2], az = r.p[i - 1], bx = r.p[i], bz = r.p[i + 1], L = Math.hypot(bx - ax, bz - az);
        if (L < 16) continue;
        const ux = (bx - ax) / L, uz = (bz - az) / L, nx = -uz, nz = ux;
        const Z = ZONES[zoneOf(ax, az)];
        for (let t = Z.gap / 2; t < L - 6; t += Z.gap) {
          const px = ax + ux * t, pz = az + uz * t;
          for (const side of [-1, 1]) {
            const R = rng(Math.round(px) * 73856093 ^ Math.round(pz) * 19349663 ^ (side + 2) * 83492791);
            if (R() < 0.35) continue; // open ground
            const d = Z.d[0] + (Z.d[1] - Z.d[0]) * R(), w = Z.gap * (0.6 + 0.25 * R());
            const off = ROAD_W[r.k] / 2 + 5 + d / 2, cx = px + nx * off * side, cz = pz + nz * off * side;
            if (clearOf(cx, cz)) continue;
            const cells = fits(cx, cz, ux, uz, nx, nz, w, d);
            if (!cells) continue;
            for (const c of cells) taken.add(c);
            const plot = { p: rect(cx, cz, ux, uz, nx, nz, w, d), x: cx, z: cz };
            plots.push(plot); put('plots', plot);
            if (R() < Z.house) { // a small house on the plot
              const hw = w * 0.5, hd = d * 0.55, roof = ROOFS[Math.floor(R() * ROOFS.length)];
              const o = { p: rect(cx, cz, ux, uz, nx, nz, hw, hd), h: 6 + R() * 5, roof, wall: '#FFFFFF', side: '#E5E7EB', x: cx, z: cz };
              houses.push(o); put('houses', o);
            }
          }
        }
      }
    }
    // trees: a light scatter, thicker in the parks
    const [x0, x1, z0, z1] = bboxOf(island);
    for (let gz = z0; gz < z1; gz += 45) for (let gx = x0; gx < x1; gx += 45) {
      const R = rng(Math.round(gx) * 2654435761 ^ Math.round(gz) * 40503);
      const px = gx + R() * 40, pz = gz + R() * 40;
      let park = false;
      for (const ic of icons) if (ic.kind === 'park' && Math.hypot(ic.x - px, ic.z - pz) < 120) { park = true; break; }
      if (R() > (park ? 0.85 : 0.07) || !maskAt(px, pz) || road.has(cell(px, pz, 6)) || taken.has(cell(px, pz, 6))) continue;
      const o = { x: px, z: pz, r: 4 + R() * 3, c: R() < 0.5 ? C.tree : C.treeLight };
      trees.push(o); put('trees', o);
    }
  }
  function drawTown() {
    const s = cam.scale * cam.zoom;
    if (s < 0.08) return; // far out, the island is its streets
    const up1 = s * lean() * 1.1; // screen pixels a metre of height stands
    const reach = Math.hypot(W, H) / s / Math.min(1, cam.tilt) * 0.7 + 100;
    const vx0 = cam.x - reach, vx1 = cam.x + reach, vz0 = cam.z - reach, vz1 = cam.z + reach;
    const P = [], Hs = [], T = [];

    'Victoria Island': { yaw: -0.12, tilt: 0.55, zoom: 1 },

  fetch('/lagos-island/map.json').then((r) => r.json()).then((m) => {

    landB = m.land.map(bboxOf); waterB = m.water.map(bboxOf);
    roadP = [0, 1, 2, 3, 4].map(() => new Path2D());
    for (const r of m.roads) { const p = roadP[r.k]; p.moveTo(r.p[0], r.p[1]); for (let i = 2; i < r.p.length; i += 2) p.lineTo(r.p[i], r.p[i + 1]); }
    icons = m.icons;
    buildMask();
    genTown();
    // start near Tafawa Balewa Square, on land
    for (let tries = 0; tries < 200; tries++) { const a = Math.random() * Math.PI * 2, d = 20 + tries * 6; const px = Math.cos(a) * d, pz = Math.sin(a) * d; if (onLand(px, pz)) { me.x = px; me.z = pz; break; } }
    cam.x = me.x; cam.z = me.z;
    updateWhere();
  });
  requestAnimationFrame(frame);

  // the welcome: your name and colour, kept in this browser
  const hello = document.getElementById('hello'), nameIn = document.getElementById('name'), colorsEl = document.getElementById('colors');
  nameIn.value = myName;
  call('online', {}).then((n) => { if (typeof n === 'number') document.getElementById('crowd').textContent = n === 1 ? '1 Lagosian' : n + ' Lagosians'; }).catch(() => {});
  for (const c of COLORS) { const s = document.createElement('span'); s.style.background = c; s.setAttribute('role', 'button'); s.setAttribute('aria-label', 'Colour ' + c); if (c === myColor) s.className = 'on'; s.onclick = () => { myColor = c; for (const o of colorsEl.children) o.className = ''; s.className = 'on'; }; colorsEl.append(s); }
  document.getElementById('go').onclick = () => {
    myName = nameIn.value.trim().slice(0, 24) || 'Lagosian';
    store.set('li.name', myName); store.set('li.color', myColor);
    hello.style.display = 'none';
    nameIn.blur(); // so the keys move you, not type into the hidden name box
    tick(); setInterval(tick, 1000);
  };
  nameIn.addEventListener('keydown', (e) => { if (e.key === 'Enter') document.getElementById('go').click(); });
})();
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>LAGOS ISLAND</title>
<meta name="description" content="LAGOS ISLAND: walk Lagos Island, Ikoyi, Victoria Island and Lekki to Ajah, together. Free, in your browser.">
<meta name="theme-color" content="#8ED1F2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #1F2A37; --dim: #6B7785; --green: #22B573; --green-dark: #189B60; --white: #FFFFFF;
    --shadow: 0 6px 20px rgba(20, 60, 100, 0.16), 0 1px 3px rgba(20, 60, 100, 0.12);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #8ED1F2; color: var(--ink); font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
  canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
  .pill { background: var(--white); border-radius: 999px; box-shadow: var(--shadow); }
  #top { position: fixed; top: max(10px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); width: min(560px, calc(100vw - 20px)); display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px 16px; pointer-events: auto; }
  #title { font-weight: 800; font-size: 17px; letter-spacing: -0.2px; white-space: nowrap; }
  #title span { margin-right: 6px; }
  #online { font-size: 13px; font-weight: 700; color: var(--green); white-space: nowrap; }
  #online i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--green); margin-right: 6px; vertical-align: 1px; }
  #talkTop { margin-left: auto; padding: 9px 16px; border: none; border-radius: 999px; background: var(--green); color: #fff; font: 700 14px 'Plus Jakarta Sans', sans-serif; cursor: pointer; }
  #chips { position: fixed; top: calc(68px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); display: flex; gap: 8px; pointer-events: none; max-width: calc(100vw - 20px); }
  #chips .pill { padding: 6px 12px; font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #where { max-width: 70vw; }
  #log { position: fixed; left: 12px; bottom: calc(150px + env(safe-area-inset-bottom)); max-width: min(360px, 72vw); font-size: 13px; pointer-events: none; display: flex; flex-direction: column; gap: 6px; }
  #log div { background: var(--white); box-shadow: var(--shadow); border-radius: 14px; padding: 6px 11px; }
  #log b { font-weight: 800; }
  .btn { position: fixed; display: grid; place-items: center; border-radius: 50%; font: 800 13px 'Plus Jakarta Sans', sans-serif; color: var(--ink); background: var(--white); box-shadow: var(--shadow); cursor: pointer; user-select: none; border: none; }
  #zoomin { right: 12px; top: calc(118px + env(safe-area-inset-top)); width: 44px; height: 44px; font-size: 22px; }
  #zoomout { right: 12px; top: calc(170px + env(safe-area-inset-top)); width: 44px; height: 44px; font-size: 22px; }
  #okada { right: 16px; bottom: calc(22px + env(safe-area-inset-bottom)); width: 84px; height: 84px; background: var(--green); color: #fff; font-size: 14px; }
  #okada:active { background: var(--green-dark); transform: scale(0.96); }
  #talk { display: none; }
  #stick { position: fixed; left: 20px; bottom: calc(20px + env(safe-area-inset-bottom)); width: 120px; height: 120px; border-radius: 50%; display: none; background: rgba(255, 255, 255, 0.55); box-shadow: var(--shadow); }
  #knob { position: absolute; left: 38px; top: 38px; width: 44px; height: 44px; border-radius: 50%; background: var(--white); box-shadow: var(--shadow); }
  .touch #stick { display: block; }
  body:not(.touch) #okada { width: 70px; height: 70px; font-size: 12px; }
  #say { position: fixed; left: 50%; transform: translateX(-50%); width: min(560px, calc(100vw - 20px)); bottom: calc(120px + env(safe-area-inset-bottom)); display: none; gap: 8px; padding: 6px; }
  #say input { flex: 1; padding: 11px 14px; border: none; border-radius: 999px; background: #F2F6FA; color: var(--ink); font: 500 15px 'Plus Jakarta Sans', sans-serif; outline: none; }
  #say button { padding: 0 20px; border-radius: 999px; border: none; background: var(--green); color: #fff; font: 800 14px 'Plus Jakarta Sans', sans-serif; }
  #card { position: fixed; left: 50%; bottom: calc(140px + env(safe-area-inset-bottom)); transform: translateX(-50%); padding: 12px 18px; border-radius: 20px; display: none; text-align: center; font-size: 13px; color: var(--dim); max-width: 86vw; background: var(--white); box-shadow: var(--shadow); }
  #card b { display: block; font-size: 18px; font-weight: 800; color: var(--ink); margin-bottom: 2px; }
  #hello { position: fixed; inset: 0; display: grid; place-items: end center; padding-bottom: max(20px, env(safe-area-inset-bottom)); background: linear-gradient(180deg, rgba(142, 209, 242, 0) 30%, rgba(90, 174, 224, 0.55)); }
  #hello .box { width: min(400px, calc(100vw - 24px)); padding: 20px; border-radius: 28px; background: rgba(255, 255, 255, 0.94); box-shadow: var(--shadow); text-align: center; }
  #hello h1 { margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.5px; }
  #hello p { margin: 6px 0 14px; color: var(--dim); font-size: 14px; line-height: 1.45; }
  #hello .crowd { font-size: 13px; color: var(--dim); margin-bottom: 12px; }
  #hello .crowd b { color: var(--ink); }
  #hello input { width: 100%; padding: 13px 16px; border-radius: 999px; border: 2px solid #E6EEF5; background: #F7FAFC; color: var(--ink); font: 600 16px 'Plus Jakarta Sans', sans-serif; text-align: center; outline-color: var(--green); }
  #colors { display: flex; justify-content: center; gap: 10px; margin: 12px 0 14px; }
  #colors span { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 3px solid #fff; box-shadow: 0 0 0 2px transparent; }
  #colors span.on { box-shadow: 0 0 0 2px var(--ink); }
  #go { width: 100%; padding: 15px; border-radius: 999px; border: none; background: var(--green); color: #fff; font: 800 17px 'Plus Jakarta Sans', sans-serif; cursor: pointer; box-shadow: 0 4px 0 var(--green-dark); }
  #go:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--green-dark); }
  #credit { position: fixed; left: 50%; transform: translateX(-50%); bottom: 2px; font-size: 9px; color: rgba(31, 42, 55, 0.6); pointer-events: none; }
</style>
</head>
<body>
<canvas id="c" aria-label="The map of Lagos Island"></canvas>
<div id="top" class="pill">
  <div id="title"><span>🌴</span>LAGOS ISLAND</div>
  <div id="online" aria-live="polite"><i></i><span id="count">1</span> online</div>
  <button id="talkTop" aria-label="Say something to people near you">Say</button>
</div>
<div id="chips"><div id="where" class="pill">📍 Tafawa Balewa Square</div></div>
<div id="log" aria-live="polite"></div>
<div id="zoomin" class="btn" role="button" aria-label="Zoom in">+</div>
<div id="zoomout" class="btn" role="button" aria-label="Zoom out">−</div>
<div id="talk" class="btn" role="button" aria-label="Say something">SAY</div>
<div id="okada" class="btn" role="button" aria-label="Hold to ride an okada (faster)">🛵 OKADA</div>
<div id="stick" aria-hidden="true"><div id="knob"></div></div>
<form id="say" class="pill"><input id="sayText" maxlength="140" placeholder="Say something to people near you" autocomplete="off"><button>Send</button></form>
<div id="card"></div>
<div id="hello">
  <div class="box">
    <h1>🌴 LAGOS ISLAND</h1>
    <p>Lagos Island, Ikoyi, VI, Lekki to Ajah, and Ilashe by the sea. Walk it, ride okada, meet the people on it.</p>
    <div class="crowd"><b id="crowd">Lagosians</b> on the island right now · free</div>
    <input id="name" maxlength="24" placeholder="Your name on the island" autocomplete="nickname">
    <div id="colors"></div>
    <button id="go">Enter Lagos Island</button>
  </div>
</div>
<div id="credit">© OpenStreetMap contributors</div>
<script>
(() => {
  // ---------- setup
  const API = new URLSearchParams(location.search).get('api') || location.origin.replace(/^(https?:\/\/)([^.]+)\./, '$1$2.api.');
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  // bright and friendly, day or night: the sky-blue sea, warm sand-cream land, white streets
  const C = { sea: '#7CC7EC', seaDeep: '#5AAEE0', land: '#FFF6E5', shore: '#F4DFB4', water: '#7CC7EC', road: ['#FFD866', '#FFE08A', '#FFFFFF', '#FFFFFF', '#FFFFFF'], casing: '#E8DCC6', icon: '#22B573', text: '#1F2A37', halo: '#FFFFFF' };
  const ROAD_W = [16, 14, 11, 9, 7]; // metres
  const ROAD_MIN = [3, 2.6, 2, 1.4, 1]; // px, so roads read when zoomed out
  const EMOJI = { beach: '🏖️', park: '🌳', faith: '⛪', market: '🛍️', tower: '🏢', hotel: '🏨', culture: '🎭', civic: '🏛️', transport: '🚌', shop: '🛍️', home: '🏡', bridge: '🌉', palace: '👑', square: '⛲', water: '⚓' };
  const EMOJI_ID = { 'central-mosque': '🕌', 'balogun': '🧺', 'idumota': '🧺', 'eko-atlantic': '🏙️', 'link-bridge': '🌉', 'lekki-toll': '🚧', 'ajah': '🧺', 'ilashe': '🏝️', 'tarkwa-bay': '🏄🏾', 'lighthouse-beach': '🗼', 'museum': '🏺', 'nike-gallery': '🎨', 'freedom-park': '🎷', 'ikoyi-club': '⛳', 'banana-island': '🍌', 'muri-okunola': '🌳', 'lekki-conservation': '🌿', 'oba-palace': '👑', 'tbs': '🇳🇬', 'obalende': '🚌', 'eko-hotel': '🏨', 'css-bookshop': '📚' };
  const KIND_DOT = { beach: '#3E9BBE', park: '#58AE7E', faith: '#9AA8F2', market: '#E2A32B', tower: '#7A6656', hotel: '#C4572E', culture: '#B05FA0', civic: '#24316B', transport: '#E5743F', shop: '#E2A32B', home: '#58AE7E', bridge: '#7A6656', palace: '#C9A227', square: '#C4572E', water: '#3E9BBE' };
  const COLORS = ['#22B573', '#FF7A45', '#3B82F6', '#A855F7', '#F59E0B', '#EC4899'];
  const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

  const cv = document.getElementById('c'), x = cv.getContext('2d');
  const isTouch = matchMedia('(pointer: coarse)').matches;
  if (isTouch) document.body.classList.add('touch');
  let W = 0, H = 0, DPR = 1;
  function resize() { DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; }
  addEventListener('resize', resize); resize();

  // ---------- the map
  let map = null, landP = [], waterP = [], roadP = [], icons = [], island = [], landB = [], waterB = [];
  const pathOf = (a) => { const p = new Path2D(); p.moveTo(a[0], a[1]); for (let i = 2; i < a.length; i += 2) p.lineTo(a[i], a[i + 1]); return p; };
  const bboxOf = (a) => { let x0 = Infinity, x1 = -Infinity, z0 = Infinity, z1 = -Infinity; for (let i = 0; i < a.length; i += 2) { x0 = Math.min(x0, a[i]); x1 = Math.max(x1, a[i]); z0 = Math.min(z0, a[i + 1]); z1 = Math.max(z1, a[i + 1]); } return [x0, x1, z0, z1]; };
  function inPoly(a, px, pz) { let c = false; for (let i = 0, j = a.length - 2; i < a.length; j = i, i += 2) { const xi = a[i], zi = a[i + 1], xj = a[j], zj = a[j + 1]; if (zi > pz !== zj > pz && px < ((xj - xi) * (pz - zi)) / (zj - zi) + xi) c = !c; } return c; }
  function onLand(px, pz) {
    if (!inPoly(island, px, pz)) return false;
    let land = false;
    for (let i = 0; i < map.land.length; i++) { const b = landB[i]; if (px > b[0] && px < b[1] && pz > b[2] && pz < b[3] && inPoly(map.land[i], px, pz)) { land = true; break; } }
    if (!land) return false;
    for (let i = 0; i < map.water.length; i++) { const b = waterB[i]; if (px > b[0] && px < b[1] && pz > b[2] && pz < b[3] && inPoly(map.water[i], px, pz)) return false; }
    return true;
  }

  // ---------- you
  const id = store.get('li.id') || (() => { const v = 'p' + Math.random().toString(36).slice(2, 12) + Date.now().toString(36); store.set('li.id', v); return v; })();
  let myName = store.get('li.name') || '', myColor = store.get('li.color') || COLORS[Math.floor(Math.random() * COLORS.length)];
  const me = { x: 0, z: 0, vx: 0, vz: 0, heading: 0 };
  const cam = { x: 0, z: 0, scale: isTouch ? 0.6 : 0.45, follow: true };

  // ---------- others and chat
  const others = new Map(); // id -> { name, color, x, z, tx, tz, seen }
  const bubbles = new Map(); // id -> { text, until }
  let since = 0, online = 1;
  const logEl = document.getElementById('log');
  function addLog(name, color, text) {
    const d = document.createElement('div');
    const b = document.createElement('b'); b.style.color = color; b.textContent = name + ': ';
    d.append(b, document.createTextNode(text));
    logEl.append(d);
    while (logEl.children.length > 4) logEl.firstChild.remove();
    setTimeout(() => d.remove(), 20000);
  }
  async function call(method, args) {
    const r = await fetch(`${API}/island/${method}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(args) });
    if (!r.ok) throw new Error(r.status);
    const t = await r.text();
    if (!t) return null;
    let v = JSON.parse(t);
    return typeof v === 'string' ? JSON.parse(v) : v;
  }
  async function tick() {
    try {
      const r = await call('tick', { id, name: myName, color: myColor, x: me.x, z: me.z, since });
      online = r.online; document.getElementById('count').textContent = online;
      document.getElementById('crowd').textContent = online === 1 ? '1 Lagosian' : `${online} Lagosians`;
      const now = performance.now(), seenIds = new Set();
      for (const p of r.players) {
        seenIds.add(p.id);
        const o = others.get(p.id);
        if (o) { o.tx = p.x; o.tz = p.z; o.name = p.name; o.color = p.color; o.seen = now; }
        else others.set(p.id, { name: p.name, color: p.color, x: p.x, z: p.z, tx: p.x, tz: p.z, seen: now });
      }
      for (const [k] of others) if (!seenIds.has(k)) others.delete(k);
      for (const l of r.chat) {
        if (l.seq <= since) continue;
        bubbles.set(l.id === id ? 'me' : l.id, { text: l.text, until: now + 7000 });
        if (since > 0 || l.id === id) addLog(l.id === id ? 'You' : l.name, l.color, l.text);
      }
      since = Math.max(since, r.seq);
    } catch { /* offline for a moment: keep walking */ }
  }

  // ---------- input
  const keys = new Set();
  let okada = false, stick = { x: 0, z: 0 };
  addEventListener('keydown', (e) => {
    if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
    if (e.key === 'Enter') { e.preventDefault(); openSay(); return; }
    keys.add(e.key.toLowerCase());
    if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright', ' '].includes(e.key.toLowerCase())) e.preventDefault();
  });
  addEventListener('keyup', (e) => keys.delete(e.key.toLowerCase()));
  addEventListener('blur', () => keys.clear());
  const okBtn = document.getElementById('okada');
  const hold = (el, on, off) => { el.addEventListener('pointerdown', (e) => { e.preventDefault(); on(); }); for (const ev of ['pointerup', 'pointercancel', 'pointerleave']) el.addEventListener(ev, off); };
  hold(okBtn, () => { okada = true; }, () => { okada = false; });
  document.getElementById('zoomin').onclick = () => zoomBy(1.4);
  document.getElementById('zoomout').onclick = () => zoomBy(1 / 1.4);
  function zoomBy(f) { cam.scale = Math.max(0.015, Math.min(3, cam.scale * f)); }

  // the joystick (phones)
  const stickEl = document.getElementById('stick'), knob = document.getElementById('knob');
  let stickId = null;
  stickEl.addEventListener('pointerdown', (e) => { stickId = e.pointerId; stickEl.setPointerCapture(e.pointerId); moveStick(e); });
  stickEl.addEventListener('pointermove', (e) => { if (e.pointerId === stickId) moveStick(e); });
  const endStick = (e) => { if (e.pointerId !== stickId) return; stickId = null; stick = { x: 0, z: 0 }; knob.style.transform = ''; };
  stickEl.addEventListener('pointerup', endStick); stickEl.addEventListener('pointercancel', endStick);
  function moveStick(e) {
    const r = stickEl.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    let dx = e.clientX - cx, dy = e.clientY - cy; const d = Math.hypot(dx, dy), max = r.width / 2 - 20;
    if (d > max) { dx *= max / d; dy *= max / d; }
    knob.style.transform = `translate(${dx}px, ${dy}px)`;
    stick = { x: dx / max, z: dy / max };
  }

  // drag to look around, pinch or wheel to zoom, tap an icon to read it
  const pts = new Map(); let pinch0 = 0, scale0 = 1, dragged = false;
  cv.addEventListener('pointerdown', (e) => { pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); dragged = false; if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch0 = Math.hypot(a.x - b.x, a.y - b.y); scale0 = cam.scale; } });
  cv.addEventListener('pointermove', (e) => {
    const p = pts.get(e.pointerId); if (!p) return;
    if (pts.size === 2) { p.x = e.clientX; p.y = e.clientY; const [a, b] = [...pts.values()]; cam.scale = Math.max(0.015, Math.min(3, scale0 * Math.hypot(a.x - b.x, a.y - b.y) / (pinch0 || 1))); return; }
    const dx = e.clientX - p.x, dy = e.clientY - p.y;
    if (Math.abs(dx) + Math.abs(dy) > 4) dragged = true;
    if (dragged) { cam.follow = false; cam.x -= dx / cam.scale; cam.z -= dy / cam.scale; }
    p.x = e.clientX; p.y = e.clientY;
  });
  const up = (e) => {
    const was = pts.get(e.pointerId); pts.delete(e.pointerId);
    if (was && !dragged && pts.size === 0) tapAt(e.clientX, e.clientY);
  };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', (e) => pts.delete(e.pointerId));
  cv.addEventListener('wheel', (e) => { e.preventDefault(); zoomBy(e.deltaY < 0 ? 1.15 : 1 / 1.15); }, { passive: false });
  const card = document.getElementById('card');
  function tapAt(sx, sy) {
    let best = null, bd = 28;
    for (const ic of icons) { const [ix, iy] = toScreen(ic.x, ic.z); const d = Math.hypot(ix - sx, iy - sy); if (d < bd) { bd = d; best = ic; } }
    if (best) { card.innerHTML = ''; const b = document.createElement('b'); b.textContent = best.name; const s = document.createElement('span'); s.textContent = districtOf(best.x, best.z); card.append(b, s); card.style.display = 'block'; clearTimeout(tapAt.t); tapAt.t = setTimeout(() => { card.style.display = 'none'; }, 4000); }
    else { card.style.display = 'none'; cam.follow = true; }
  }

  // chat
  const sayForm = document.getElementById('say'), sayText = document.getElementById('sayText');
  function openSay() { sayForm.style.display = 'flex'; sayText.focus(); }
  document.getElementById('talk').onclick = openSay;
  document.getElementById('talkTop').onclick = openSay;
  sayForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const t = sayText.value.trim(); sayText.value = ''; sayForm.style.display = 'none'; sayText.blur();
    if (!t) return;
    bubbles.set('me', { text: t, until: performance.now() + 7000 });
    try { await call('say', { id, text: t }); } catch {}
  });
  sayText.addEventListener('keydown', (e) => { if (e.key === 'Escape') { sayForm.style.display = 'none'; sayText.blur(); } });

  // ---------- where you are
  function districtOf(px, pz) {
    const lon = map.origin.lon + px / (111320 * Math.cos(map.origin.lat * Math.PI / 180)), lat = map.origin.lat - pz / 110540;
    if (lat < 6.415 && lon < 3.40) return 'The barrier beach (by boat)';
    if (lon < 3.405) return 'Lagos Island';
    if (lat < 6.418) return 'Eko Atlantic';
    if (lon < 3.445 && lat > 6.443) return 'Ikoyi';
    if (lon < 3.445) return 'Victoria Island';
    if (lon < 3.50) return 'Lekki';
    if (lon < 3.55) return 'Lekki: Chevron and Ikota';
    return 'Ajah';
  }
  const whereEl = document.getElementById('where');
  function updateWhere() {
    let best = null, bd = 700;
    for (const ic of icons) { const d = Math.hypot(ic.x - me.x, ic.z - me.z); if (d < bd) { bd = d; best = ic; } }
    whereEl.textContent = '📍 ' + (best ? `${best.name} · ${districtOf(me.x, me.z)}` : districtOf(me.x, me.z));
  }

  // ---------- drawing
  const toScreen = (wx, wz) => [(wx - cam.x) * cam.scale + W / 2, (wz - cam.z) * cam.scale + H / 2];
  function draw() {
    x.setTransform(DPR, 0, 0, DPR, 0, 0);
    const g = x.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#8ED1F2'); g.addColorStop(1, C.seaDeep);
    x.fillStyle = g; x.fillRect(0, 0, W, H);
    if (!map) return;
    const s = cam.scale;
    x.setTransform(DPR * s, 0, 0, DPR * s, DPR * (W / 2 - cam.x * s), DPR * (H / 2 - cam.z * s));
    // only the island: everything beyond it (the mainland too) is left as sea
    x.save(); x.clip(islandP);
    x.strokeStyle = C.shore; x.lineWidth = Math.max(6, 5 / s); x.lineJoin = 'round';
    for (const p of landP) x.stroke(p); // a sandy edge where land meets water
    x.fillStyle = C.land; for (const p of landP) x.fill(p);
    x.fillStyle = C.water; for (const p of waterP) x.fill(p);
    // roads, minor first
    x.lineCap = 'round'; x.lineJoin = 'round';
    for (let k = 4; k >= 0; k--) {
      if (k === 4 && s < 0.06) continue;
      const w = Math.max(ROAD_W[k], ROAD_MIN[k] / s);
      x.strokeStyle = C.casing; x.lineWidth = w + 2.2 / s; x.stroke(roadP[k]);
      x.strokeStyle = C.road[k]; x.lineWidth = w; x.stroke(roadP[k]);
    }
    x.restore();
    x.setTransform(DPR, 0, 0, DPR, 0, 0);
    // icons: an emoji in a white circle, its name in a white pill when you're close enough to read it
    const label = s > 0.2;
    x.textAlign = 'center'; x.textBaseline = 'middle';
    for (const ic of icons) {
      const [ix, iy] = toScreen(ic.x, ic.z);
      if (ix < -120 || ix > W + 120 || iy < -60 || iy > H + 60) continue;
      const r = s > 0.2 ? 15 : 11;
      x.save(); x.shadowColor = 'rgba(20,60,100,0.25)'; x.shadowBlur = 8; x.shadowOffsetY = 2;
      x.beginPath(); x.arc(ix, iy, r, 0, Math.PI * 2); x.fillStyle = '#fff'; x.fill(); x.restore();
      x.font = (r * 1.15) + 'px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
      x.fillText(EMOJI_ID[ic.id] || EMOJI[ic.kind] || '📍', ix, iy + 1);
      if (label) {
        x.font = '700 12px "Plus Jakarta Sans", sans-serif';
        const w = x.measureText(ic.name).width + 16;
        x.save(); x.shadowColor = 'rgba(20,60,100,0.18)'; x.shadowBlur = 6; x.shadowOffsetY = 1;
        x.beginPath(); x.roundRect(ix - w / 2, iy + r + 4, w, 22, 11); x.fillStyle = '#fff'; x.fill(); x.restore();
        x.fillStyle = C.text; x.fillText(ic.name, ix, iy + r + 15.5);
      }
    }
    x.textBaseline = 'alphabetic';
    // people
    const now = performance.now();
    for (const [pid, o] of others) drawPerson(o.x, o.z, o.color, o.name, bubbles.get(pid), now);
    drawPerson(me.x, me.z, myColor, myName || 'You', bubbles.get('me'), now, true);
  }
  function drawPerson(px, pz, color, name, bubble, now, mine) {
    const [sx, sy] = toScreen(px, pz);
    if (sx < -80 || sx > W + 80 || sy < -80 || sy > H + 80) return;
    const r = mine ? 13 : 11;
    if (mine) { x.beginPath(); x.arc(sx, sy, r + 9, 0, Math.PI * 2); x.fillStyle = color + '30'; x.fill(); }
    x.save(); x.shadowColor = 'rgba(20,60,100,0.3)'; x.shadowBlur = 8; x.shadowOffsetY = 2;
    x.beginPath(); x.arc(sx, sy, r + 3, 0, Math.PI * 2); x.fillStyle = '#fff'; x.fill(); x.restore();
    x.beginPath(); x.arc(sx, sy, r, 0, Math.PI * 2); x.fillStyle = color; x.fill();
    x.textAlign = 'center'; x.textBaseline = 'middle';
    x.font = '800 ' + (r + 1) + 'px "Plus Jakarta Sans", sans-serif'; x.fillStyle = '#fff';
    x.fillText((name || '?').trim().charAt(0).toUpperCase(), sx, sy + 1);
    x.font = '700 12px "Plus Jakarta Sans", sans-serif';
    const nw = x.measureText(name).width + 14;
    x.save(); x.shadowColor = 'rgba(20,60,100,0.18)'; x.shadowBlur = 5;
    x.beginPath(); x.roundRect(sx - nw / 2, sy + r + 6, nw, 20, 10); x.fillStyle = mine ? '#22B573' : '#fff'; x.fill(); x.restore();
    x.fillStyle = mine ? '#fff' : C.text; x.fillText(name, sx, sy + r + 16.5);
    if (bubble && bubble.until > now) {
      x.font = '600 14px "Plus Jakarta Sans", sans-serif';
      const t = bubble.text.length > 40 ? bubble.text.slice(0, 39) + '…' : bubble.text;
      const w = x.measureText(t).width + 22, top = sy - r - 42;
      x.save(); x.shadowColor = 'rgba(20,60,100,0.22)'; x.shadowBlur = 10; x.shadowOffsetY = 2;
      x.beginPath(); x.roundRect(sx - w / 2, top, w, 30, 15); x.moveTo(sx - 6, top + 30); x.lineTo(sx, top + 37); x.lineTo(sx + 6, top + 30);
      x.fillStyle = '#fff'; x.fill(); x.restore();
      x.fillStyle = C.text; x.fillText(t, sx, top + 15.5);
    }
    x.textBaseline = 'alphabetic';
  }

  // ---------- the loop
  let islandP, last = performance.now(), whereT = 0;
  function frame(t) {
    const dt = Math.min(0.05, (t - last) / 1000); last = t;
    if (map && document.getElementById('hello').style.display === 'none') {
      let ix = stick.x, iz = stick.z;
      if (keys.has('a') || keys.has('arrowleft')) ix -= 1;
      if (keys.has('d') || keys.has('arrowright')) ix += 1;
      if (keys.has('w') || keys.has('arrowup')) iz -= 1;
      if (keys.has('s') || keys.has('arrowdown')) iz += 1;
      const L = Math.hypot(ix, iz);
      if (L > 0.08) {
        const fast = okada || keys.has('shift');
        const speed = (fast ? 32 : 9) * Math.min(1, L);
        const nx = me.x + (ix / L) * speed * dt, nz = me.z + (iz / L) * speed * dt;
        if (onLand(nx, nz)) { me.x = nx; me.z = nz; }
        else if (onLand(nx, me.z)) me.x = nx;
        else if (onLand(me.x, nz)) me.z = nz;
        cam.follow = true;
      }
    }
    if (cam.follow) { cam.x += (me.x - cam.x) * Math.min(1, dt * 6); cam.z += (me.z - cam.z) * Math.min(1, dt * 6); }
    for (const o of others.values()) { o.x += (o.tx - o.x) * Math.min(1, dt * 4); o.z += (o.tz - o.z) * Math.min(1, dt * 4); }
    if (map && (whereT += dt) > 0.5) { whereT = 0; updateWhere(); }
    draw();
    requestAnimationFrame(frame);
  }

  // ---------- start
  fetch('/lagos-island/map.json').then((r) => r.json()).then((m) => {
    map = m; island = m.island; islandP = pathOf(m.island);
    landP = m.land.map(pathOf); waterP = m.water.map(pathOf);
    landB = m.land.map(bboxOf); waterB = m.water.map(bboxOf);
    roadP = [0, 1, 2, 3, 4].map(() => new Path2D());
    for (const r of m.roads) { const p = roadP[r.k]; p.moveTo(r.p[0], r.p[1]); for (let i = 2; i < r.p.length; i += 2) p.lineTo(r.p[i], r.p[i + 1]); }
    icons = m.icons;
    // start near Tafawa Balewa Square, on land
    for (let tries = 0; tries < 200; tries++) { const a = Math.random() * Math.PI * 2, d = 20 + tries * 6; const px = Math.cos(a) * d, pz = Math.sin(a) * d; if (onLand(px, pz)) { me.x = px; me.z = pz; break; } }
    cam.x = me.x; cam.z = me.z;
    updateWhere();
  });
  requestAnimationFrame(frame);

  // the welcome: your name and colour, kept in this browser
  const hello = document.getElementById('hello'), nameIn = document.getElementById('name'), colorsEl = document.getElementById('colors');
  nameIn.value = myName;
  call('online', {}).then((n) => { if (typeof n === 'number') document.getElementById('crowd').textContent = n === 1 ? '1 Lagosian' : n + ' Lagosians'; }).catch(() => {});
  for (const c of COLORS) { const s = document.createElement('span'); s.style.background = c; s.setAttribute('role', 'button'); s.setAttribute('aria-label', 'Colour ' + c); if (c === myColor) s.className = 'on'; s.onclick = () => { myColor = c; for (const o of colorsEl.children) o.className = ''; s.className = 'on'; }; colorsEl.append(s); }
  document.getElementById('go').onclick = () => {
    myName = nameIn.value.trim().slice(0, 24) || 'Lagosian';
    store.set('li.name', myName); store.set('li.color', myColor);
    hello.style.display = 'none';
    nameIn.blur(); // so the keys move you, not type into the hidden name box
    tick(); setInterval(tick, 1000);
  };
  nameIn.addEventListener('keydown', (e) => { if (e.key === 'Enter') document.getElementById('go').click(); });
})();
</script>
</body>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>LAGOS ISLAND</title>
<meta name="description" content="LAGOS ISLAND: Lagos Island, Ikoyi, VI, Lekki, Ajah and Ilashe as a little game town. Walk it, ride it, meet the people on it. Free, in your browser.">
<meta name="theme-color" content="#4F9FD8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --ink: #1F2A37; --dim: #6B7785; --green: #22B573; --green-dark: #189B60; --shadow: 0 6px 20px rgba(20, 60, 100, 0.16), 0 1px 3px rgba(20, 60, 100, 0.12); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #4F9FD8; color: var(--ink); font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
  canvas { display: block; position: fixed; inset: 0; width: 100%; height: 100%; touch-action: none; }
  .pill { background: #fff; border-radius: 999px; box-shadow: var(--shadow); }
  #top { position: fixed; top: max(10px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); width: min(560px, calc(100vw - 20px)); display: flex; align-items: center; gap: 10px; padding: 8px 10px 8px 16px; }
  #title { font-weight: 800; font-size: 17px; white-space: nowrap; }
  #online { font-size: 13px; font-weight: 700; color: var(--green); white-space: nowrap; }
  #online i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--green); margin-right: 6px; vertical-align: 1px; }
  #talkTop { margin-left: auto; padding: 9px 16px; border: none; border-radius: 999px; background: var(--green); color: #fff; font: 700 14px 'Plus Jakarta Sans', sans-serif; cursor: pointer; }
  #chips { position: fixed; top: calc(68px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); display: flex; gap: 8px; pointer-events: none; max-width: calc(100vw - 20px); }
  #chips .pill { padding: 6px 12px; font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #log { position: fixed; left: 12px; bottom: calc(150px + env(safe-area-inset-bottom)); max-width: min(360px, 72vw); font-size: 13px; pointer-events: none; display: flex; flex-direction: column; gap: 6px; }
  #log div { background: #fff; box-shadow: var(--shadow); border-radius: 14px; padding: 6px 11px; }
  #log b { font-weight: 800; }
  .btn { position: fixed; display: grid; place-items: center; border-radius: 50%; font: 800 13px 'Plus Jakarta Sans', sans-serif; color: var(--ink); background: #fff; box-shadow: var(--shadow); cursor: pointer; user-select: none; border: none; }
  #zoomin { right: 12px; top: calc(118px + env(safe-area-inset-top)); width: 44px; height: 44px; font-size: 22px; }
  #zoomout { right: 12px; top: calc(170px + env(safe-area-inset-top)); width: 44px; height: 44px; font-size: 22px; }
  #okada { right: 16px; bottom: calc(22px + env(safe-area-inset-bottom)); width: 84px; height: 84px; background: var(--green); color: #fff; font-size: 14px; }
  #okada:active { background: var(--green-dark); transform: scale(0.96); }
  #stick { position: fixed; left: 20px; bottom: calc(20px + env(safe-area-inset-bottom)); width: 120px; height: 120px; border-radius: 50%; display: none; background: rgba(255, 255, 255, 0.55); box-shadow: var(--shadow); }
  #knob { position: absolute; left: 38px; top: 38px; width: 44px; height: 44px; border-radius: 50%; background: #fff; box-shadow: var(--shadow); }
  .touch #stick { display: block; }
  body:not(.touch) #okada { width: 70px; height: 70px; font-size: 12px; }
  #say { position: fixed; left: 50%; transform: translateX(-50%); width: min(560px, calc(100vw - 20px)); bottom: calc(120px + env(safe-area-inset-bottom)); display: none; gap: 8px; padding: 6px; }
  #say input { flex: 1; padding: 11px 14px; border: none; border-radius: 999px; background: #F2F6FA; color: var(--ink); font: 500 15px 'Plus Jakarta Sans', sans-serif; outline: none; }
  #say button { padding: 0 20px; border-radius: 999px; border: none; background: var(--green); color: #fff; font: 800 14px 'Plus Jakarta Sans', sans-serif; }
  #card { position: fixed; left: 50%; bottom: calc(140px + env(safe-area-inset-bottom)); transform: translateX(-50%); padding: 12px 18px; border-radius: 20px; display: none; text-align: center; font-size: 13px; color: var(--dim); max-width: 86vw; background: #fff; box-shadow: var(--shadow); }
  #card b { display: block; font-size: 18px; font-weight: 800; color: var(--ink); margin-bottom: 2px; }
  #hello { position: fixed; inset: 0; display: grid; place-items: end center; padding-bottom: max(20px, env(safe-area-inset-bottom)); background: linear-gradient(180deg, rgba(79, 159, 216, 0) 35%, rgba(40, 100, 160, 0.5)); }
  #hello .box { width: min(400px, calc(100vw - 24px)); padding: 20px; border-radius: 28px; background: rgba(255, 255, 255, 0.95); box-shadow: var(--shadow); text-align: center; }
  #hello h1 { margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.5px; }
  #hello p { margin: 6px 0 14px; color: var(--dim); font-size: 14px; line-height: 1.45; }
  #hello .crowd { font-size: 13px; color: var(--dim); margin-bottom: 12px; }
  #hello .crowd b { color: var(--ink); }
  #hello input { width: 100%; padding: 13px 16px; border-radius: 999px; border: 2px solid #E6EEF5; background: #F7FAFC; color: var(--ink); font: 600 16px 'Plus Jakarta Sans', sans-serif; text-align: center; outline-color: var(--green); }
  #colors { display: flex; justify-content: center; gap: 10px; margin: 12px 0 14px; }
  #colors span { width: 30px; height: 30px; border-radius: 50%; cursor: pointer; border: 3px solid #fff; box-shadow: 0 0 0 2px transparent; }
  #colors span.on { box-shadow: 0 0 0 2px var(--ink); }
  #go { width: 100%; padding: 15px; border-radius: 999px; border: none; background: var(--green); color: #fff; font: 800 17px 'Plus Jakarta Sans', sans-serif; cursor: pointer; box-shadow: 0 4px 0 var(--green-dark); }
  #go:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--green-dark); }
</style>
</head>
<body>
<canvas id="c" aria-label="LAGOS ISLAND, the game board"></canvas>
<div id="top" class="pill">
  <div id="title">🌴 LAGOS ISLAND</div>
  <div id="online" aria-live="polite"><i></i><span id="count">1</span> online</div>
  <button id="talkTop" aria-label="Say something to people near you">Say</button>
</div>
<div id="chips"><div id="where" class="pill">📍 Lagos Island</div></div>
<div id="log" aria-live="polite"></div>
<div id="zoomin" class="btn" role="button" aria-label="Zoom in">+</div>
<div id="zoomout" class="btn" role="button" aria-label="Zoom out">−</div>
<div id="okada" class="btn" role="button" aria-label="Hold to ride an okada (faster)">🛵 OKADA</div>
<div id="stick" aria-hidden="true"><div id="knob"></div></div>
<form id="say" class="pill"><input id="sayText" maxlength="140" placeholder="Say something to people near you" autocomplete="off"><button>Send</button></form>
<div id="card"></div>
<div id="hello">
  <div class="box">
    <h1>🌴 LAGOS ISLAND</h1>
    <p>Lagos Island, Ikoyi, VI, Eko Atlantic, Lekki and Ajah, and Ilashe across the water. Walk it, ride okada, meet the people on it.</p>
    <div class="crowd"><b id="crowd">Lagosians</b> on the island right now · free</div>
    <input id="name" maxlength="24" placeholder="Your name on the island" autocomplete="nickname">
    <div id="colors"></div>
    <button id="go">Enter Lagos Island</button>
  </div>
</div>
<script>
(() => {
  // ================= the board =================
  // LAGOS ISLAND is a little game town, not a map to scale: the island's districts as slabs of land
  // on a grid of lots (1 tile = 10 units), cut by the lagoon and creeks, joined by bridges, each
  // landmark its own small model. Rows run north (top) to south; columns west to east.
  const T = 10; // a tile, in world units
  const BOARD = { w: 50, h: 29 };
  const SECTORS = [
    { id: 'lagos', name: 'Lagos Island', rect: [2, 4, 13, 15], rows: [6, 10, 14], cols: [4, 9], cam: { yaw: -0.32, pitch: 0.95, zoom: 1.0 } },
    { id: 'ikoyi', name: 'Ikoyi', rect: [16, 3, 25, 11], rows: [6, 9], cols: [19, 23], cam: { yaw: 0.35, pitch: 0.9, zoom: 1.0 } },
    { id: 'vi', name: 'Victoria Island', rect: [16, 14, 27, 21], rows: [16, 19], cols: [19, 23], cam: { yaw: -0.5, pitch: 0.95, zoom: 0.95 } },
    { id: 'atlantic', name: 'Eko Atlantic', rect: [15, 24, 24, 27], rows: [25], cols: [19, 23], cam: { yaw: 0.15, pitch: 0.85, zoom: 0.95 } },
    { id: 'lekki', name: 'Lekki', rect: [30, 8, 41, 21], rows: [9, 15, 19], cols: [33, 37], cam: { yaw: 0.25, pitch: 0.95, zoom: 0.95 } },
    { id: 'ajah', name: 'Ajah', rect: [44, 10, 49, 18], rows: [15], cols: [46], cam: { yaw: 0.55, pitch: 0.9, zoom: 1.05 } },
    { id: 'ilashe', name: 'Ilashe', rect: [3, 22, 10, 26], rows: [24], cols: [], sand: true, cam: { yaw: -0.6, pitch: 0.85, zoom: 1.05 } },
  ];
  // bridges and the ferry: [i0, j0, i1, j1, name]
  const BRIDGES = [
    [14, 6, 15, 6, 'Bridge to Ikoyi'],
    [19, 12, 19, 13, 'Falomo Bridge'],
    [26, 9, 29, 9, 'Lekki-Ikoyi Link Bridge'],
    [28, 19, 29, 19, 'Lekki Toll Road'],
    [23, 22, 23, 23, 'To Eko Atlantic'],
    [42, 15, 43, 15, 'Lekki-Ajah Bridge'],
  ];
  const FERRY = [4, 16, 4, 21]; // Lagos Island to Ilashe, by boat
  // the landmarks: [type, i, j, wi, dj, name, emoji]
  const PLACES = [
    // Lagos Island
    ['mosque', 5, 7, 3, 3, 'Lagos Central Mosque', '🕌'],
    ['market', 10, 7, 4, 3, 'Balogun Market', '🧺'],
    ['shops', 5, 4, 3, 2, 'Idumota', '🛍️'],
    ['palace', 10, 4, 4, 2, "Iga Idunganran (Oba's Palace)", '👑'],
    ['fountain', 2, 7, 2, 3, 'Tinubu Square', '⛲'],
    ['cathedral', 2, 11, 2, 3, 'Cathedral Church of Christ', '⛪'],
    ['field', 5, 11, 4, 3, 'Tafawa Balewa Square', '⭐'],
    ['towers', 10, 11, 4, 3, 'The Marina & NECOM House', '🏢'],
    ['park', 5, 15, 4, 1, 'Freedom Park', '🎷'],
    ['hospital', 10, 15, 4, 1, 'General Hospital', '🏥'],
    ['jetty', 2, 15, 2, 1, 'Marina Jetty (boats to Ilashe)', '⛴️'],
    // Ikoyi
    ['golf', 24, 7, 2, 2, 'Ikoyi Club 1938', '⛳'],
    ['villas', 24, 3, 2, 3, 'Banana Island', '🏡'],
    ['arcade', 20, 10, 3, 2, 'Falomo Shopping Centre', '🛍️'],
    ['motorpark', 16, 7, 3, 2, 'Obalende Motor Park', '🚌'],
    ['houses', 20, 7, 3, 2, 'Ikoyi homes', '🏠'],
    ['houses', 16, 3, 3, 3, 'Old Ikoyi', '🏠'],
    // Victoria Island
    ['hotel', 24, 17, 4, 2, 'Eko Hotel', '🏨'],
    ['glass', 20, 14, 3, 2, 'Lagos Civic Centre', '🏛️'],
    ['park', 16, 17, 3, 2, 'Muri Okunola Park', '🌳'],
    ['hotel', 16, 14, 3, 2, 'Federal Palace Hotel', '🏨'],
    ['beach', 20, 20, 3, 2, 'Bar Beach', '🏖️'],
    ['beach', 24, 20, 4, 2, 'Kuramo Beach', '🏖️'],
    ['towers', 24, 14, 4, 2, 'Adeola Odeku offices', '🏢'],
    // Eko Atlantic
    ['skyline', 15, 26, 4, 2, 'Eko Atlantic City', '🏙️'],
    ['skyline', 20, 26, 3, 2, 'Eko Pearl Towers', '🏙️'],
    // Lekki
    ['tollgate', 30, 15, 3, 1, 'Lekki Toll Gate', '🚧'],
    ['gallery', 34, 10, 3, 3, 'Nike Art Gallery', '🎨'],
    ['forest', 38, 10, 4, 4, 'Lekki Conservation Centre', '🌿'],
    ['mall', 38, 16, 4, 3, 'Circle Mall', '🛍️'],
    ['beach', 34, 20, 3, 2, 'Elegushi Beach', '🏖️'],
    ['beach', 30, 20, 3, 2, 'Landmark Beach', '🏖️'],
    ['houses', 30, 10, 3, 3, 'Lekki Phase 1', '🏠'],
    ['houses', 34, 16, 3, 3, 'Lekki estates', '🏠'],
    // Ajah
    ['market', 44, 11, 2, 3, 'Ajah Market', '🧺'],
    ['houses', 47, 11, 3, 3, 'Victoria Garden City', '🏡'],
    // Ilashe
    ['beach', 3, 22, 4, 2, 'Ilashe Beach', '🏝️'],
    ['huts', 7, 22, 4, 2, 'Ilashe beach houses', '🛖'],
  ];
  const BILLBOARDS = [
    [13, 3.4, 'WYRD', 'Ask me anything'],
    [27, 13.4, 'LAGOS ISLAND', 'Eko o ni baje'],
    [41, 7.4, 'WYRD', 'Lekki? I know the way'],
  ];
  const WATER_NAMES = [['LAGOS LAGOON', 20, 1.2], ['ATLANTIC OCEAN', 36, 26], ['FIVE COWRIE CREEK', 14.6, 12.5], ['COMMODORE CHANNEL', 6, 19]];

  // ---- the ground, tile by tile: water, land, sand, road, bridge, ferry
  const W0 = 0, LAND = 1, SAND = 2, ROAD = 3, BRIDGE = 4, FERRYLANE = 5;
  const tile = new Uint8Array(BOARD.w * BOARD.h);
  const sectorAt = new Int8Array(BOARD.w * BOARD.h).fill(-1);
  const at = (i, j) => (i < 0 || j < 0 || i >= BOARD.w || j >= BOARD.h ? W0 : tile[j * BOARD.w + i]);
  SECTORS.forEach((s, k) => {
    const [i0, j0, i1, j1] = s.rect;
    for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
      const road = s.rows.includes(j) || s.cols.includes(i);
      tile[j * BOARD.w + i] = road ? ROAD : s.sand ? SAND : LAND;
      sectorAt[j * BOARD.w + i] = k;
    }
  });
  for (const [i0, j0, i1, j1] of BRIDGES) for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) tile[j * BOARD.w + i] = BRIDGE;
  for (let j = FERRY[1]; j <= FERRY[3]; j++) tile[j * BOARD.w + FERRY[0]] = FERRYLANE;
  // the beaches' sand
  for (const p of PLACES) if (p[0] === 'beach') for (let j = p[2]; j < p[2] + p[4]; j++) for (let i = p[1]; i < p[1] + p[3]; i++) if (at(i, j) === LAND) tile[j * BOARD.w + i] = SAND;
  const blocked = []; // footprints you walk round: [x0, z0, x1, z1]

  // ================= the camera: a real 3D view, turned and tilted for each sector =================
  const cv = document.getElementById('c'), x = cv.getContext('2d');
  const isTouch = matchMedia('(pointer: coarse)').matches;
  if (isTouch) document.body.classList.add('touch');
  let W = 0, H = 0, DPR = 1;
  function resize() { DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; }
  addEventListener('resize', resize); resize();
  const cam = { x: 75, z: 105, yaw: -0.32, pitch: 0.95, zoom: 1, user: isTouch ? 1.15 : 1, follow: true };
  let co = 1, si = 0, sp = 1, cp = 0, K = 1;
  function setCam() {
    co = Math.cos(cam.yaw); si = Math.sin(cam.yaw); sp = Math.sin(cam.pitch); cp = Math.cos(cam.pitch);
    K = 4.6 * cam.zoom * cam.user * Math.min(1.25, Math.max(0.75, Math.min(W, H) / 700));
  }
  // world (x, y up, z) to screen [sx, sy, depth]
  function P(wx, wy, wz) {
    const dx = wx - cam.x, dz = wz - cam.z;
    const rx = dx * co - dz * si, rz = dx * si + dz * co;
    return [W / 2 + K * rx, H * 0.55 + K * (rz * sp - wy * cp), rz * cp + wy * sp];
  }
  const viewDot = (nx, ny, nz) => { const rz = nx * si + nz * co; return ny * cp + rz * sp; }; // > 0: faces you
  const toWorldDir = (dx, dy) => { const rz = dy / sp; return [dx * co + rz * si, -dx * si + rz * co]; };

  // ---- colour and light: soft light from the north-west
  const LIGHT = (() => { const l = [-0.5, 1, -0.35]; const n = Math.hypot(...l); return l.map((v) => v / n); })();
  function shadeHex(hex, f) { const n = parseInt(hex.slice(1), 16); const c = (v) => Math.max(0, Math.min(255, Math.round(v * f))); return `rgb(${c(n >> 16)},${c((n >> 8) & 255)},${c(n & 255)})`; }
  const lit = (hex, nx, ny, nz) => shadeHex(hex, 0.72 + 0.34 * Math.max(0, nx * LIGHT[0] + ny * LIGHT[1] + nz * LIGHT[2]));
  const C = {
    water: '#4F9FD8', land: '#B5D69B', landEdge: '#8FB878', sand: '#F1DFA8', sandEdge: '#D9C283',
    road: '#8C949C', roadLine: '#E6E9EC', plot: '#E3E6EA', plotEdge: '#CDD3D9', paving: '#D9DDE2', grassLot: '#A3CC86',
    white: '#F8FAFC', tree: '#3F8F4F', treeLight: '#55A863', trunk: '#8B5E3C',
  };

  // ================= drawing kit: flat quads, boxes, roofs, domes, trees, people =================
  const quad = (pts, fill, stroke) => { x.beginPath(); x.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) x.lineTo(pts[i][0], pts[i][1]); x.closePath(); x.fillStyle = fill; x.fill(); if (stroke) { x.strokeStyle = stroke; x.lineWidth = 1; x.stroke(); } };
  const flat = (x0, z0, x1, z1, y, fill, stroke) => quad([P(x0, y, z0), P(x1, y, z0), P(x1, y, z1), P(x0, y, z1)], fill, stroke);
  // a box from (x0, y0, z0) to (x1, y1, z1); win: window colour (a grid of windows on the walls)
  function box(x0, y0, z0, x1, y1, z1, col, win, winRows) {
    const faces = [
      [[x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1], 0, 0, 1],
      [[x1, y0, z0], [x0, y0, z0], [x0, y1, z0], [x1, y1, z0], 0, 0, -1],
      [[x1, y0, z1], [x1, y0, z0], [x1, y1, z0], [x1, y1, z1], 1, 0, 0],
      [[x0, y0, z0], [x0, y0, z1], [x0, y1, z1], [x0, y1, z0], -1, 0, 0],
    ];
    for (const f of faces) {
      if (viewDot(f[4], f[5], f[6]) <= 0) continue;
      const pts = [P(...f[0]), P(...f[1]), P(...f[2]), P(...f[3])];
      quad(pts, lit(col, f[4], f[5], f[6]));
      if (win) windows(pts, win, winRows || Math.max(1, Math.round((y1 - y0) / 3.2)));
    }
    quad([P(x0, y1, z0), P(x1, y1, z0), P(x1, y1, z1), P(x0, y1, z1)], lit(col, 0, 1, 0));
  }
  // a grid of windows on a wall (pts: bottom-left, bottom-right, top-right, top-left)
  function windows(pts, col, rows) {
    const [a, b, c, d] = pts, cols = Math.max(1, Math.round(Math.hypot(b[0] - a[0], b[1] - a[1]) / 9));
    if (Math.hypot(d[0] - a[0], d[1] - a[1]) / rows < 3) return;
    x.fillStyle = col;
    const lerp = (p, q, t) => [p[0] + (q[0] - p[0]) * t, p[1] + (q[1] - p[1]) * t];
    for (let r = 0; r < rows; r++) for (let k = 0; k < cols; k++) {
      const u0 = (k + 0.22) / cols, u1 = (k + 0.78) / cols, v0 = (r + 0.25) / rows, v1 = (r + 0.7) / rows;
      const pt = (u, v) => lerp(lerp(a, b, u), lerp(d, c, u), v);
      const q = [pt(u0, v0), pt(u1, v0), pt(u1, v1), pt(u0, v1)];
      x.beginPath(); x.moveTo(q[0][0], q[0][1]); for (let i = 1; i < 4; i++) x.lineTo(q[i][0], q[i][1]); x.closePath(); x.fill();
    }
  }
  // a gable roof over (x0, z0)-(x1, z1) at height y, ridge h above, along the longer side
  function gable(x0, z0, x1, z1, y, h, col) {
    const alongX = x1 - x0 >= z1 - z0, mx = (x0 + x1) / 2, mz = (z0 + z1) / 2;
    if (alongX) {
      const r0 = P(x0, y + h, mz), r1 = P(x1, y + h, mz);
      const sides = [[[P(x0, y, z1), P(x1, y, z1), r1, r0], 0, 0.7, 0.7], [[P(x1, y, z0), P(x0, y, z0), r0, r1], 0, 0.7, -0.7]];
      for (const [pts, nx, ny, nz] of sides) if (viewDot(nx, ny, nz) > 0) quad(pts, lit(col, nx, ny, nz));
      for (const [xe, nx] of [[x0, -1], [x1, 1]]) if (viewDot(nx, 0, 0) > 0) quad([P(xe, y, z0), P(xe, y, z1), P(xe, y + h, mz)], lit(C.white, nx, 0, 0));
    } else {
      const r0 = P(mx, y + h, z0), r1 = P(mx, y + h, z1);
      const sides = [[[P(x1, y, z0), P(x1, y, z1), r1, r0], 0.7, 0.7, 0], [[P(x0, y, z1), P(x0, y, z0), r0, r1], -0.7, 0.7, 0]];
      for (const [pts, nx, ny, nz] of sides) if (viewDot(nx, ny, nz) > 0) quad(pts, lit(col, nx, ny, nz));
      for (const [ze, nz] of [[z0, -1], [z1, 1]]) if (viewDot(0, 0, nz) > 0) quad([P(x0, y, ze), P(x1, y, ze), P(mx, y + h, ze)], lit(C.white, 0, 0, nz));
    }
  }
  function pyramid(x0, z0, x1, z1, y, h, col) {
    const top = P((x0 + x1) / 2, y + h, (z0 + z1) / 2);
    const sides = [[[x0, z1], [x1, z1], 0, 0.6, 0.8], [[x1, z0], [x0, z0], 0, 0.6, -0.8], [[x1, z1], [x1, z0], 0.8, 0.6, 0], [[x0, z0], [x0, z1], -0.8, 0.6, 0]];
    for (const [a, b, nx, ny, nz] of sides) if (viewDot(nx, ny, nz) > 0) quad([P(a[0], y, a[1]), P(b[0], y, b[1]), top], lit(col, nx, ny, nz));
  }
  function dome(cx, cz, y, r, col) {
    const c = P(cx, y, cz), t = P(cx, y + r, cz), rr = r * K;
    const g = x.createRadialGradient(c[0] - rr * 0.35, t[1] + rr * 0.3, rr * 0.1, c[0], c[1], rr * 1.1);
    g.addColorStop(0, shadeHex(col, 1.25)); g.addColorStop(1, shadeHex(col, 0.8));
    x.fillStyle = g; x.beginPath(); x.ellipse(c[0], c[1], rr, rr * sp, 0, 0, Math.PI);
    x.ellipse(c[0], c[1], rr, Math.max(rr * 0.4, c[1] - t[1]), 0, Math.PI, Math.PI * 2); x.fill();
  }
  function tree(tx, tz, r, col) {
    const base = P(tx, 0, tz), top = P(tx, r * 1.6, tz), rr = r * K;
    x.fillStyle = 'rgba(30,60,35,0.22)'; x.beginPath(); x.ellipse(base[0] + rr * 0.3, base[1], rr, rr * sp * 0.9, 0, 0, Math.PI * 2); x.fill();
    x.strokeStyle = C.trunk; x.lineWidth = Math.max(1.5, K * 0.5); x.beginPath(); x.moveTo(base[0], base[1]); x.lineTo(top[0], top[1]); x.stroke();
    x.fillStyle = col || C.tree; x.beginPath(); x.arc(top[0], top[1] - rr * 0.3, rr, 0, Math.PI * 2); x.fill();
    x.fillStyle = 'rgba(255,255,255,0.18)'; x.beginPath(); x.arc(top[0] - rr * 0.35, top[1] - rr * 0.65, rr * 0.4, 0, Math.PI * 2); x.fill();
  }
  function palm(tx, tz, h) {
    const base = P(tx, 0, tz), top = P(tx + 0.6, h, tz), s = K;
    x.strokeStyle = '#9C6B43'; x.lineWidth = Math.max(1.5, s * 0.55); x.beginPath(); x.moveTo(base[0], base[1]); x.quadraticCurveTo(base[0] + s * 1.5, (base[1] + top[1]) / 2, top[0], top[1]); x.stroke();
    x.strokeStyle = '#2F8A4A'; x.lineWidth = Math.max(1.5, s * 0.7); x.lineCap = 'round';
    for (let k = 0; k < 6; k++) { const a = (k / 6) * Math.PI * 2; x.beginPath(); x.moveTo(top[0], top[1]); x.quadraticCurveTo(top[0] + Math.cos(a) * s * 2.6, top[1] + Math.sin(a) * s * 1.2 - s, top[0] + Math.cos(a) * s * 3.6, top[1] + Math.sin(a) * s * 1.6 + s * 0.8); x.stroke(); }
    x.lineCap = 'butt';
  }
  function umbrella(ux, uz, col) {
    const base = P(ux, 0, uz), top = P(ux, 3.2, uz), rr = 2.2 * K;
    x.strokeStyle = '#6B7280'; x.lineWidth = Math.max(1, K * 0.3); x.beginPath(); x.moveTo(base[0], base[1]); x.lineTo(top[0], top[1]); x.stroke();
    x.fillStyle = col; x.beginPath(); x.ellipse(top[0], top[1], rr, rr * sp * 0.8, 0, 0, Math.PI * 2); x.fill();
    x.fillStyle = 'rgba(255,255,255,0.5)'; x.beginPath(); x.ellipse(top[0], top[1], rr * 0.35, rr * sp * 0.28, 0, 0, Math.PI * 2); x.fill();
  }
  function danfo(dx, dz, along) { // the yellow minibus
    const w = along ? 4.4 : 2.2, d = along ? 2.2 : 4.4;
    box(dx - w / 2, 0, dz - d / 2, dx + w / 2, 2.2, dz + d / 2, '#F7C81E', '#2B3440', 1);
    flat(dx - w / 2 + 0.2, dz - d / 2 + 0.2, dx + w / 2 - 0.2, dz + d / 2 - 0.2, 2.25, '#111827');
  }
  function billboard(bx, bz, title, line) {
    for (const ox of [-3, 3]) box(bx + ox - 0.25, 0, bz - 0.25, bx + ox + 0.25, 7, bz + 0.25, '#4B5563');
    const a = P(bx - 6, 7, bz), b = P(bx + 6, 7, bz), c = P(bx + 6, 13, bz), d = P(bx - 6, 13, bz);
    quad([a, b, c, d], '#1F2937');
    const inset = (p, q, t) => [p[0] + (q[0] - p[0]) * t, p[1] + (q[1] - p[1]) * t];
    const g = x.createLinearGradient(a[0], a[1], c[0], c[1]); g.addColorStop(0, '#22B573'); g.addColorStop(1, '#0EA5E9');
    quad([inset(a, c, 0.06), inset(b, d, 0.06), inset(c, a, 0.06), inset(d, b, 0.06)], g);
    const mid = [(a[0] + c[0]) / 2, (a[1] + c[1]) / 2], wpx = Math.hypot(b[0] - a[0], b[1] - a[1]);
    if (wpx < 30) return;
    x.save(); x.translate(mid[0], mid[1]); x.rotate(Math.atan2(b[1] - a[1], b[0] - a[0]));
    x.fillStyle = '#fff'; x.textAlign = 'center'; x.textBaseline = 'middle';
    x.font = `800 ${Math.round(wpx * 0.13)}px "Plus Jakarta Sans", sans-serif`; x.fillText(title, 0, -wpx * 0.06);
    x.font = `600 ${Math.round(wpx * 0.075)}px "Plus Jakarta Sans", sans-serif`; x.fillText(line, 0, wpx * 0.09);
    x.restore();
  }
  function boat(bx, bz) {
    const p = [P(bx - 4, 0.4, bz - 1.3), P(bx + 4, 0.4, bz - 1.3), P(bx + 5, 0.4, bz), P(bx + 4, 0.4, bz + 1.3), P(bx - 4, 0.4, bz + 1.3)];
    quad(p, '#F8FAFC', '#94A3B8');
    box(bx - 1.6, 0.4, bz - 0.9, bx + 1.6, 2, bz + 0.9, '#0EA5E9');
  }
  function rnd(seed) { let t = (seed * 2654435761) >>> 0; return () => { t += 0x6D2B79F5; let r = Math.imul(t ^ (t >>> 15), 1 | t); r ^= r + Math.imul(r ^ (r >>> 7), 61 | r); return ((r ^ (r >>> 14)) >>> 0) / 4294967296; }; }

  // ================= the landmarks, each its own little model =================
  // each draws inside its lot: x0, z0 (north-west corner) to x1, z1, in world units
  const STALLS = ['#EF4444', '#F59E0B', '#22C55E', '#3B82F6', '#A855F7', '#EC4899', '#14B8A6', '#F97316'];
  const MODELS = {
    mosque(a, b, c, d) {
      flat(a, b, c, d, 0.05, C.paving, C.plotEdge);
      const m = 4;
      box(a + m, 0, b + m, c - m, 9, d - m, '#FFFFFF', '#2F855A', 2);
      dome((a + c) / 2, (b + d) / 2, 9, Math.min(c - a, d - b) * 0.3, '#22A06B');
      for (const [px, pz] of [[a + 2, b + 2], [c - 2, b + 2], [a + 2, d - 2], [c - 2, d - 2]]) {
        box(px - 0.9, 0, pz - 0.9, px + 0.9, 20, pz + 0.9, '#FFFFFF');
        box(px - 1.2, 15, pz - 1.2, px + 1.2, 15.8, pz + 1.2, '#E2E8F0');
        pyramid(px - 0.9, pz - 0.9, px + 0.9, pz + 0.9, 20, 3, '#22A06B');
      }
    },
    market(a, b, c, d) {
      flat(a, b, c, d, 0.05, C.paving, C.plotEdge);
      const n = Math.max(2, Math.round((c - a) / 6)), mm = Math.max(2, Math.round((d - b) / 6));
      const sw = (c - a - 2) / n, sd = (d - b - 2) / mm;
      for (let i = 0; i < n; i++) for (let j = 0; j < mm; j++) {
        const x0 = a + 1 + i * sw + 0.5, z0 = b + 1 + j * sd + 0.5;
        box(x0, 0, z0, x0 + sw - 1, 2.6, z0 + sd - 1, '#F3F4F6');
        flat(x0 - 0.3, z0 - 0.3, x0 + sw - 0.7, z0 + sd - 0.7, 2.7, STALLS[(i * 3 + j * 5) % STALLS.length]);
      }
    },
    shops(a, b, c, d) {
      flat(a, b, c, d, 0.05, C.paving, C.plotEdge);
      const n = 3, w = (c - a - 2) / n;
      for (let i = 0; i < n; i++) {
        const x0 = a + 1 + i * w, h = 7 + ((i * 5) % 4) * 2;
        box(x0 + 0.3, 0, b + 2, x0 + w - 0.3, h, d - 2, ['#FDE68A', '#FECACA', '#BFDBFE'][i], '#475569');
        box(x0 + 0.3, 2.6, d - 2, x0 + w - 0.3, 3.2, d - 0.6, STALLS[i + 2]); // a shop awning
      }
    },
    palace(a, b, c, d) {
      flat(a, b, c, d, 0.05, '#E9E2D0');
      const m = 0.6;
      for (const [x0, z0, x1, z1] of [[a + m, b + m, c - m, b + m + 0.6], [a + m, d - m - 0.6, c - m, d - m], [a + m, b + m, a + m + 0.6, d - m], [c - m - 0.6, b + m, c - m, d - m]]) box(x0, 0, z0, x1, 2.4, z1, '#E5D3B3');
      box(a + 6, 0, b + 4, c - 6, 6, d - 4, '#FFF7E6');
      gable(a + 5.5, b + 3.5, c - 5.5, d - 3.5, 6, 4, '#B91C1C');
    },
    fountain(a, b, c, d) {
      flat(a, b, c, d, 0.05, '#E5E7EB', C.plotEdge);
      const cx = (a + c) / 2, cz = (b + d) / 2, r = Math.min(c - a, d - b) * 0.28;
      const ctr = P(cx, 0.6, cz);
      x.fillStyle = '#CBD5E1'; x.beginPath(); x.ellipse(ctr[0], ctr[1], r * K * 1.15, r * K * sp * 1.15, 0, 0, Math.PI * 2); x.fill();
      x.fillStyle = '#60A5FA'; x.beginPath(); x.ellipse(ctr[0], ctr[1], r * K, r * K * sp, 0, 0, Math.PI * 2); x.fill();
      box(cx - 0.6, 0.6, cz - 0.6, cx + 0.6, 3.5, cz + 0.6, '#F8FAFC');
      x.fillStyle = 'rgba(255,255,255,0.8)'; const tp = P(cx, 4.2, cz); x.beginPath(); x.arc(tp[0], tp[1], Math.max(2, K * 0.9), 0, Math.PI * 2); x.fill();
      for (const [px, pz] of [[a + 2, b + 2], [c - 2, d - 2]]) palm(px, pz, 8);
    },
    cathedral(a, b, c, d) {
      flat(a, b, c, d, 0.05, C.grassLot);
      box(a + 2.5, 0, b + 7, c - 2.5, 9, d - 2, '#F1EBDD', '#7C6F57', 2);
      gable(a + 2.2, b + 6.7, c - 2.2, d - 1.7, 9, 5, '#7F1D1D');
      box(a + 5, 0, b + 2, c - 5, 18, b + 7, '#F1EBDD', '#7C6F57', 3);
      pyramid(a + 5, b + 2, c - 5, b + 7, 18, 10, '#7F1D1D');
    },
    field(a, b, c, d) {
      flat(a, b, c, d, 0.05, '#7BC26A');
      flat(a + 2, b + 2, c - 2, d - 2, 0.1, '#86CC74');
      x.strokeStyle = 'rgba(255,255,255,0.85)'; x.lineWidth = 1.2;
      const e = [P(a + 2, 0.12, b + 2), P(c - 2, 0.12, b + 2), P(c - 2, 0.12, d - 2), P(a + 2, 0.12, d - 2)];
      x.beginPath(); x.moveTo(e[0][0], e[0][1]); for (let i = 1; i < 4; i++) x.lineTo(e[i][0], e[i][1]); x.closePath(); x.stroke();
      box(a + 3, 0, b - 0.5, c - 3, 4, b + 2, '#F8FAFC'); // the grandstand
      box(a + 3, 4, b - 0.5, c - 3, 4.4, b + 2.4, '#16A34A');
      for (const [px, pz] of [[c - 3, d - 4], [a + 3, d - 4]]) { box(px - 0.15, 0, pz - 0.15, px + 0.15, 9, pz + 0.15, '#9CA3AF'); flat(px + 0.15, pz - 0.05, px + 3.2, pz + 0.05, 8.2, '#16A34A'); }
    },
    towers(a, b, c, d) {
      flat(a, b, c, d, 0.05, C.paving, C.plotEdge);
      const hs = [34, 52, 26], n = Math.max(2, Math.round((c - a) / 13)), w = (c - a - 2) / n;
      for (let i = 0; i < n; i++) {
        const x0 = a + 1 + i * w + 1, h = hs[i % 3];
        box(x0, 0, b + 3, x0 + w - 2, h, d - 3, i % 2 ? '#94A3B8' : '#7FB3D9', i % 2 ? '#334155' : '#DCEBF7');
        box(x0 + 2, h, b + 6, x0 + w - 4, h + 3, d - 6, '#64748B');
        if (i === 1) box(x0 + w / 2 - 1.3, h + 3, (b + d) / 2 - 0.2, x0 + w / 2 - 1, h + 14, (b + d) / 2 + 0.2, '#9CA3AF'); // a mast
      }
    },
    park(a, b, c, d) {
      flat(a, b, c, d, 0.05, C.grassLot);
      const pth = [P(a, 0.08, (b + d) / 2), P(c, 0.08, (b + d) / 2)];
      x.strokeStyle = '#E7D8B2'; x.lineWidth = Math.max(2, K * 1.4); x.beginPath(); x.moveTo(pth[0][0], pth[0][1]); x.lineTo(pth[1][0], pth[1][1]); x.stroke();
      for (let i = 0; i < Math.round((c - a) * (d - b) / 60); i++) { const R = rnd(a * 31 + b * 17 + i); tree(a + 2 + R() * (c - a - 4), b + 2 + R() * (d - b - 4), 2.4 + R() * 1.4, R() < 0.5 ? C.tree : C.treeLight); }
    },
    hospital(a, b, c, d) {
      flat(a, b, c, d, 0.05, C.paving, C.plotEdge);
      box(a + 3, 0, b + 1.5, c - 3, 12, d - 1.5, '#FFFFFF', '#93C5FD', 3);
      const cx = (a + c) / 2, cz = (b + d) / 2;
      flat(cx - 2.6, cz - 0.8, cx + 2.6, cz + 0.8, 12.05, '#EF4444'); flat(cx - 0.8, cz - 2.6, cx + 0.8, cz + 2.6, 12.06, '#EF4444');
    },
    jetty(a, b, c, d) {
      flat(a, b, c, d + 4, 0.3, '#A16207');
      boat(a + 5, d + 6);
    },
    golf(a, b, c, d) {
      flat(a, b, c, d, 0.05, '#86CC74');
      const g = P((a + c) / 2, 0.1, (b + d) / 2);
      x.fillStyle = '#9BE08A'; x.beginPath(); x.ellipse(g[0], g[1], 6 * K, 4 * K * sp, 0, 0, Math.PI * 2); x.fill();
      const f0 = P((a + c) / 2 + 1, 0, (b + d) / 2), f1 = P((a + c) / 2 + 1, 8, (b + d) / 2);
      x.strokeStyle = '#F8FAFC'; x.lineWidth = Math.max(1, K * 0.3); x.beginPath(); x.moveTo(f0[0], f0[1]); x.lineTo(f1[0], f1[1]); x.stroke();
      x.fillStyle = '#EF4444'; x.beginPath(); x.moveTo(f1[0], f1[1]); x.lineTo(f1[0] + K * 3, f1[1] + K); x.lineTo(f1[0], f1[1] + K * 2); x.fill();
      for (const [px, pz] of [[a + 2, b + 2], [c - 2, d - 2], [a + 2, d - 2]]) tree(px, pz, 2.6);
    },
    villas(a, b, c, d) {
      flat(a, b, c, d, 0.05, C.grassLot);
      for (let k = 0; k < 2; k++) {
        const z0 = b + 2 + k * ((d - b) / 2);
        box(a + 2, 0, z0, a + 11, 6, z0 + 7, '#FFFFFF', '#93C5FD', 1);
        flat(a + 12, z0 + 1, c - 2, z0 + 6, 0.1, '#38BDF8'); // the pool
        palm(c - 2, z0 + 7, 9);
      }
    },
    arcade(a, b, c, d) {
      flat(a, b, c, d, 0.05, C.paving, C.plotEdge);
      box(a + 2, 0, b + 3, c - 2, 5, d - 2, '#E5E7EB', '#334155', 1);
      box(a + 1.5, 3, d - 2, c - 1.5, 3.5, d - 0.5, '#0EA5E9');
    },
    motorpark(a, b, c, d) {
      flat(a, b, c, d, 0.05, '#CBD5E1', C.plotEdge);
      box(a + 1, 4, b + 1, c - 1, 4.5, b + 7, '#10B981'); // the shade canopy
      for (const px of [a + 1.3, c - 1.6]) box(px, 0, b + 1.3, px + 0.3, 4, b + 1.6, '#6B7280');
      for (let k = 0; k < 4; k++) danfo(a + 4 + k * 6, d - 4, false);
    },
    houses(a, b, c, d) {
      flat(a, b, c, d, 0.05, C.grassLot);
      const R = rnd(a * 7 + b * 13), n = Math.max(2, Math.round((c - a) * (d - b) / 130));
      for (let k = 0; k < n; k++) {
        const cx = a + 4 + ((k * 11) % Math.max(1, c - a - 8)), cz = b + 4 + ((k * 7) % Math.max(1, d - b - 8));
        box(cx - 3, 0, cz - 2.5, cx + 3, 4.5, cz + 2.5, ['#FFFFFF', '#FFF7E6', '#FDE68A', '#FECACA'][k % 4]);
        gable(cx - 3.3, cz - 2.8, cx + 3.3, cz + 2.8, 4.5, 3, ['#C2410C', '#9A3412', '#475569', '#0F766E'][k % 4]);
        if (R() < 0.7) tree(cx + 4.5, cz + 3, 2);
      }
    },
    hotel(a, b, c, d) {
      flat(a, b, c, d, 0.05, C.paving, C.plotEdge);
      box(a + 2, 0, b + 2, c - 2, 38, b + 8, '#F8FAFC', '#60A5FA');
      box(a + 2, 38, b + 2, c - 2, 40, b + 8, '#0EA5E9');
      flat(a + 3, b + 10, c - 8, d - 2, 0.1, '#38BDF8'); // the pool
      palm(c - 3, d - 3, 9); palm(c - 6, b + 11, 8);
    },
    glass(a, b, c, d) {
      flat(a, b, c, d, 0.05, C.paving, C.plotEdge);
      box(a + 4, 0, b + 3, c - 4, 14, d - 3, '#7FB3D9', '#DCEBF7', 4);
      box(a + 6, 14, b + 5, c - 6, 16, d - 5, '#E2E8F0');
    },
    beach(a, b, c, d) {
      const cols = ['#EF4444', '#F59E0B', '#3B82F6', '#EC4899', '#22C55E'];
      for (let k = 0; k < Math.round((c - a) / 5); k++) umbrella(a + 3 + k * 5, b + 5 + (k % 2) * 6, cols[k % cols.length]);
      palm(a + 2, b + 2, 10); palm(c - 3, b + 3, 9);
    },
    skyline(a, b, c, d) {
      flat(a, b, c, d, 0.05, C.paving, C.plotEdge);
      const hs = [60, 85, 48, 70], n = Math.max(2, Math.round((c - a) / 9)), w = (c - a - 2) / n;
      for (let i = 0; i < n; i++) { const x0 = a + 1 + i * w + 0.8; box(x0, 0, b + 4, x0 + w - 1.6, hs[i % 4], b + 12, i % 2 ? '#93C5FD' : '#BAE6FD', '#E0F2FE'); }
    },
    tollgate(a, b, c, d) {
      const z = (b + d) / 2;
      for (const px of [a + 1, c - 1]) box(px - 0.5, 0, z - 4, px + 0.5, 6, z + 4, '#9CA3AF');
      box(a, 6, z - 5, c, 7, z + 5, '#F8FAFC');
      box(a, 7, z - 5, c, 7.4, z + 5, '#EF4444');
      for (let k = 1; k < 4; k++) box(a + k * (c - a) / 4 - 0.8, 0, z - 1, a + k * (c - a) / 4 + 0.8, 3, z + 1, '#F3F4F6');
    },
    gallery(a, b, c, d) {
      flat(a, b, c, d, 0.05, C.grassLot);
      box(a + 3, 0, b + 3, c - 3, 9, d - 3, '#FFFFFF');
      const st = ['#EF4444', '#F59E0B', '#22C55E', '#3B82F6', '#A855F7'];
      for (let k = 0; k < 5; k++) { const z0 = b + 3 + k * ((d - b - 6) / 5); box(c - 3, 1, z0 + 0.3, c - 2.7, 8, z0 + (d - b - 6) / 5 - 0.3, st[k]); }
      tree(a + 2, d - 2, 2.4); tree(c - 1.5, b + 2, 2.2);
    },
    forest(a, b, c, d) {
      flat(a, b, c, d, 0.05, '#7FB86A');
      for (let i = 0; i < Math.round((c - a) * (d - b) / 26); i++) { const R = rnd(a * 13 + b * 7 + i * 3); tree(a + 2 + R() * (c - a - 4), b + 2 + R() * (d - b - 4), 2.2 + R() * 1.6, R() < 0.6 ? '#2F7D3F' : C.tree); }
      const w0 = P(a + 2, 6, b + 4), w1 = P((a + c) / 2, 7, (b + d) / 2), w2 = P(c - 2, 6, d - 4);
      x.strokeStyle = '#A16207'; x.lineWidth = Math.max(2, K * 0.8); x.beginPath(); x.moveTo(w0[0], w0[1]); x.lineTo(w1[0], w1[1]); x.lineTo(w2[0], w2[1]); x.stroke();
    },
    mall(a, b, c, d) {
      flat(a, b, c, d, 0.05, C.paving, C.plotEdge);
      box(a + 2, 0, b + 3, c - 2, 9, d - 7, '#F1F5F9', '#475569', 2);
      box(a + 2, 9, b + 3, c - 2, 10, d - 7, '#22B573');
      for (let k = 0; k < 5; k++) box(a + 3 + k * 6, 0, d - 5, a + 5.2 + k * 6, 1.4, d - 2, ['#EF4444', '#3B82F6', '#F8FAFC', '#111827', '#F59E0B'][k]); // cars

    if (s) sector = s;
    let best = null, bd = 45;
    for (const p of PLACES) { const d = Math.hypot((p[1] + p[3] / 2) * T - me.x, (p[2] + p[4] / 2) * T - me.z); if (d < bd) { bd = d; best = p; } }
    whereEl.textContent = onFerry(me.x, me.z) ? '⛴️ On the boat to Ilashe' : '📍 ' + (best ? `${best[5]} · ${sector.name}` : sector.name);
  }

  // ================= the loop =================
  let last = performance.now(), whereT = 0, playing = false;
  function frame(t) {
    const dt = Math.min(0.05, (t - last) / 1000); last = t;
    if (playing) {
      let ix = stick.x, iz = stick.z;
      if (keys.has('a') || keys.has('arrowleft')) ix -= 1;
      if (keys.has('d') || keys.has('arrowright')) ix += 1;
      if (keys.has('w') || keys.has('arrowup')) iz -= 1;
      if (keys.has('s') || keys.has('arrowdown')) iz += 1;
      const L = Math.hypot(ix, iz);
      if (L > 0.08) {
        const fast = okada || keys.has('shift'), speed = (fast ? 34 : 12) * Math.min(1, L);
        const [wx, wz] = toWorldDir(ix / L, (iz / L) * sp), wl = Math.hypot(wx, wz) || 1;
        const nx = me.x + (wx / wl) * speed * dt, nz = me.z + (wz / wl) * speed * dt;
        if (walkable(nx, nz)) { me.x = nx; me.z = nz; } else if (walkable(nx, me.z)) me.x = nx; else if (walkable(me.x, nz)) me.z = nz;
        cam.follow = true;
      }
    }
    if (cam.follow) { const e = Math.min(1, dt * 5); cam.x += (me.x - cam.x) * e; cam.z += (me.z - cam.z) * e; }
    // each sector its own angle: the camera glides there
    const want = sector.cam, e2 = Math.min(1, dt * 1.4);
    let dy = want.yaw - cam.yaw; dy = Math.atan2(Math.sin(dy), Math.cos(dy));
    cam.yaw += dy * e2; cam.pitch += (want.pitch - cam.pitch) * e2; cam.zoom += (want.zoom - cam.zoom) * e2;
    for (const o of others.values()) { o.x += (o.tx - o.x) * Math.min(1, dt * 4); o.z += (o.tz - o.z) * Math.min(1, dt * 4); }
    if ((whereT += dt) > 0.4) { whereT = 0; updateWhere(); }
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
  updateWhere();

  // ---- the welcome: your name and colour, kept in this browser
  const hello = document.getElementById('hello'), nameIn = document.getElementById('name'), colorsEl = document.getElementById('colors');
  nameIn.value = myName;
  call('online', {}).then((n) => { if (typeof n === 'number') document.getElementById('crowd').textContent = n === 1 ? '1 Lagosian' : n + ' Lagosians'; }).catch(() => {});
  for (const c of COLORS) { const s = document.createElement('span'); s.style.background = c; s.setAttribute('role', 'button'); s.setAttribute('aria-label', 'Colour ' + c); if (c === myColor) s.className = 'on'; s.onclick = () => { myColor = c; for (const o of colorsEl.children) o.className = ''; s.className = 'on'; }; colorsEl.append(s); }
  document.getElementById('go').onclick = () => {
    myName = nameIn.value.trim().slice(0, 24) || 'Lagosian';
    store.set('li.name', myName); store.set('li.color', myColor);
    hello.style.display = 'none'; nameIn.blur(); playing = true;
    tick(); setInterval(tick, 1000);
  };
  nameIn.addEventListener('keydown', (e) => { if (e.key === 'Enter') document.getElementById('go').click(); });
})();
</script>

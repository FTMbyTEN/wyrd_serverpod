services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: wyrd
      POSTGRES_PASSWORD: "5nRjW8lWWkduJU6f9vA6HVPE0039Kmjz"
    volumes:
      - wyrd_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "zedYe-wKFg1XrwjZ-mMd488gkSX0QprE"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: wyrd_test
      POSTGRES_PASSWORD: "Pjkf84mkyAC7sg7PuG78BbhoRSHFO0zE"
    volumes:
      - wyrd_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "Rz7RnKjDGn3gbQwBdNcdUPVzIEEEXn77"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  wyrd_data:
  wyrd_test_data:
